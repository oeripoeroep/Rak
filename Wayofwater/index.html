<script>
var S=[
{t:"The Stream at the Edge of the Field",ti:"Sungai di Tepi Ladang",
id:["Bayangkan Anda berdiri di tepi ladang selepas badai. Sungai kecil meluap. Anda bisa melawannya dengan karung pasir dan teriakan, atau membaca kemiringan tanah, menggali satu parit, lalu membiarkan air pergi sendiri.","Lima kitab Tiongkok kuno ini adalah buku panduan untuk pilihan kedua. Ditulis sekitar 2.200 hingga 2.500 tahun lalu, saat negeri-negeri saling berperang dan kekuatan saja tak lagi cukup. Satu pertanyaan mengikat semuanya: bagaimana memengaruhi pikiran, pasar, dan manusia dengan tenaga sekecil mungkin, tetapi hasil yang bertahan paling lama?","Jawabannya ternyata berupa tangga, dan air adalah benang merahnya. Di kelimanya, air muncul sebagai teladan: tidak melawan medan, hanya membacanya.","Lihatlah bagaimana kelimanya menyebut air. Tao Te Ching menjadikannya wujud Jalan. Zhuangzi menyebut air tenang sebagai cermin. Konfusius, berdiri di tepi sungai, berkata bahwa segala sesuatu berlalu seperti ini, siang dan malam tanpa henti. Guanzi punya bab khusus, <i>Shui Di</i>, yang menyebut air sebagai darah dan napas bumi serta akar segala sesuatu. Sun Tzu menyamakan pasukan dengan air yang mengikuti medan. Maka satu gagasan layak dibawa sejak awal: air adalah teladan orang yang efektif. Ia tak melawan medan, melainkan membacanya, dan lama-kelamaan ia mengukir ngarai."],
en:["Picture yourself at the edge of a field after a storm. A small stream has overflowed. You can fight it with sandbags and shouting, or read the slope, dig one channel, and let the water leave on its own.","These five ancient Chinese classics are manuals for the second choice. They were written some 2,200 to 2,500 years ago, when states were at war and force alone had stopped working. One question binds them: how do you move minds, markets, and people with the least effort and the longest-lasting result?","The answer turns out to be a ladder, and water is the thread. In all five books it is the model: it does not fight the terrain, it reads it.","Look at how all five reach for water. The Tao Te Ching makes it the image of the Way. Zhuangzi calls still water a mirror. Confucius, standing by a river, says things pass on like this, day and night without ceasing. Guanzi has a whole chapter, <i>Shui Di</i>, calling water the blood and breath of the earth and the root of all things. Sun Tzu likens an army to water following the terrain. So carry one idea forward from the start: water is the model of the effective person. It does not fight the terrain, it reads it, and over time it carves canyons."]},
{t:"Tao Te Ching",k:"道",ti:"Seni Tidak Memaksa",
id:["<b>Gagasan inti:</b> bertindak selaras dengan cara kerja kenyataan, bukan melawannya. Kitab ini berlapis tiga: <i>Dao</i> (pola di balik segala perubahan), <i>De</i> (daya halus orang yang selaras dengannya), dan seni memimpin tanpa memaksa. Judulnya bisa dibaca sebagai Kitab tentang Jalan dan Dayanya.","Delapan puluh satu bab pendek ini menjadikan air sebagai teladan tertinggi: lembut, rendah hati, mengalir ke tempat yang dihindari orang, namun sanggup mengikis batu. Pesan intinya adalah <i>wu wei</i>, bertindak tanpa memaksa. Bukan berarti berpangku tangan, melainkan menakar tenaga sesuai bentuk keadaan.","Dua pelajaran praktisnya terasa sampai hari ini. Pertama, sisakan ruang kosong. Roda berguna karena lubang di tengahnya, kamar berguna karena ruang di dalamnya, dan jadwal yang penuh sesak tak sanggup menyerap kejutan. Kedua, jadilah pemimpin yang nyaris tak terasa.","Kitab ini dibuka dengan peringatan: Jalan yang sepenuhnya bisa diucapkan bukanlah Jalan yang tetap. Kenyataan lebih besar daripada deskripsi kita. Begitu merasa memegang rumus hidup, rumus itu sudah usang. Maka curigailah kepastian. Model apa pun tentang orang, pasar, atau situasi hanyalah peta, bukan wilayahnya, dan orang kuat memegang petanya dengan longgar. Hal serupa berlaku untuk <i>wu wei</i>. Bayangkan peselancar yang tak mengalahkan ombak, melainkan membacanya dan membiarkan tenaga ombak bekerja. Upaya tetap ada, tetapi sejalan dengan air.","Air mengajarkan empat hal. Ia mengalir ke tempat rendah, sehingga tak pernah bisa dijatuhkan. Ia menyesuaikan diri: dituang ke cawan menjadi cawan, ke mangkuk menjadi mangkuk. Ia gigih: tetesan yang cukup lama melubangi batu. Dan ia tak bersaing, sehingga nyaris tak ada yang sanggup bersaing dengannya. Kelemahan kitab ini pun perlu diakui jujur: ia memberi arah, jarang memberi cara. Itulah sebabnya empat kitab lain dibutuhkan.","Bab 17 membagi pemimpin ke dalam empat tingkat. Yang terbaik nyaris tak disadari rakyatnya. Di bawahnya ada yang dicintai dan dipuji, lalu yang ditakuti, dan yang terburuk adalah yang dibenci. Ujiannya sederhana: apa yang terjadi bila Anda pergi sebulan? Bila semuanya runtuh, Anda membangun ketergantungan, bukan kekuatan.","Lao Tzu menjaga tiga harta: welas asih, hemat, dan tak berani menjadi yang pertama. Paradoksnya disengaja. Welas asih melahirkan keberanian, hemat melahirkan kemurahan hati, dan tidak berebut tampil lebih dulu membuat orang percaya. Soal masalah, tangani yang besar selagi masih kecil. Memerintah negeri besar, katanya, seperti memasak ikan kecil: jangan terlalu sering dibolak-balik.","<blockquote>Ketika pekerjaan selesai, orang akan berkata: kami sendiri yang melakukannya.</blockquote>","<b>Yang bisa dibawa:</b> baca situasi sebelum bertindak, karena kebanyakan tenaga terbuang pada aksi sebelum paham. Pimpin dari bawah: kerendahan hati bukan kelemahan, melainkan posisi strategis yang menghilangkan perlawanan. Sisakan ruang kosong di jadwal, pikiran, dan rencana. Campur tangan lebih awal dan ringan. Jangan terlalu banyak mengatur."],
en:["<b>Core idea:</b> act in line with how reality works instead of against it. The book has three layers: the <i>Dao</i> (the pattern beneath all change), <i>De</i> (the quiet power of someone aligned with it), and the art of leading without forcing. The title reads as The Classic of the Way and Its Power.","These 81 short chapters hold up water as the highest model: soft, humble, flowing to the places people avoid, yet able to wear down stone. The core idea is <i>wu wei</i>, acting without forcing. It does not mean doing nothing. It means matching your effort to the shape of the situation.","Two lessons still bite today. First, keep empty space. A wheel is useful because of its hollow hub, a room because of the space inside, and a packed calendar cannot absorb a surprise. Second, be a leader who is barely noticed.","The book opens with a warning: the Way that can be fully spoken is not the constant Way. Reality is bigger than our descriptions. The moment you think you hold a formula for life, it is already out of date. So distrust certainty. Any model of a person, a market, or a situation is a map, not the territory, and strong people hold their maps lightly. The same goes for <i>wu wei</i>. Picture a surfer who does not defeat the wave but reads it and lets its energy do the work. Effort is present, but aligned with the water.","Water teaches four things. It goes low, so it can never be toppled. It adapts: poured into a cup, it becomes the cup. It persists: a drip, given years, bores through stone. And it does not compete, so almost no one can compete with it. The book's weakness deserves honesty: it gives orientation, rarely method. That is why the other four are needed.","Chapter 17 ranks leaders in four tiers. The best is barely noticed by the people. Below come the one they love and praise, then the one they fear, and worst the one they despise. The test is simple: what happens if you leave for a month? If everything collapses, you built dependency, not strength.","Lao Tzu guards three treasures: compassion, frugality, and not daring to be first. The paradoxes are deliberate. Compassion breeds courage, frugality breeds generosity, and not rushing to the front makes people trust you. On problems, handle the large while it is still small. Ruling a big state, he says, is like cooking a small fish: do not keep flipping it.","<blockquote>When the work is done, the people say: we did it ourselves.</blockquote>","<b>What to take:</b> read the situation before you act, since most force is wasted on action before understanding. Lead from beneath: humility is not weakness but a strategic position that removes resistance. Keep empty space in your schedule, mind, and plans. Intervene early and lightly. Do not over-manage."]},
{t:"Zhuangzi",k:"莊",ti:"Kebebasan Pikiran yang Lentur",
id:["<b>Gagasan inti:</b> yang menghalangi kita mengalir bukan dunia, melainkan pandangan kita yang membeku. Lapisannya empat: kebebasan dari sudut pandang tunggal, keahlian tanpa paksaan, ketenangan batin, dan kelonggaran terhadap tuntutan serba guna.","Kalau Lao Tzu berbisik, Zhuangzi tertawa. Ia bertanya apa yang membuat kita tak bisa mengalir seperti air, dan jawabnya: pendapat kita yang membeku. Katak dalam tempurung tak mampu membayangkan samudra, bukan karena bodoh, tetapi karena tempurung itulah satu-satunya dunia yang ia kenal.","Kisah Koki Ding paling terkenal. Pisaunya awet sembilan belas tahun karena ia memotong lewat celah sendi, bukan membacok tulang. Ahli melihat struktur masalah dan bekerja searah serat. Ada pula kisah penjaga monyet: tiga biji di pagi hari dan empat di sore hari, para monyet marah. Dibalik menjadi empat pagi dan tiga sore, mereka girang. Jumlahnya tetap tujuh. Orang sering bereaksi pada kemasan, bukan isi.","Pelajarannya ganda: pahami bagaimana pembingkaian bekerja pada orang lain, dan jangan jadi monyetnya.","Perangkat favorit Zhuangzi adalah pergantian skala. Burung Peng terbang sembilan puluh ribu li dalam satu penerbangan, dan jangkrik menertawakannya: untuk apa jauh-jauh, bukankah pohon sebelah cukup? Keduanya benar dari tempatnya masing-masing. Maka sebelum menyebut orang lain bodoh, tanyakan dari sudut pandang apa ia melihat, dan apa titik buta Anda sendiri. Inilah akar setiap negosiasi dan penjualan yang baik. Pada kisah ikan, Zhuangzi berdiri di jembatan dan berkata ikan-ikan itu bahagia. Hui Shi, si ahli logika, membantah: Anda bukan ikan. Zhuangzi menjawab: Anda bukan saya. Pemahaman terhadap manusia lebih sering lahir dari kepekaan daripada dari debat.","Pesan Koki Ding berlapis empat: kuasai struktur, ikuti serat, pelankan di titik sulit, dan sadari bahwa aus adalah ongkos. Bila Anda kelelahan, mungkin Anda sedang membacok tulang.","Dalam mimpi kupu-kupu yang terkenal itu, Zhuang Zhou terbangun lalu bertanya: apakah ia manusia yang bermimpi menjadi kupu-kupu, atau kupu-kupu yang kini bermimpi menjadi manusia? Anda tak perlu menuntaskan teka-tekinya. Efek praktisnya adalah melonggarkan cengkeraman identitas dan kepastian, sehingga kita lebih mudah belajar dan melihat peluang yang luput dari diri yang kaku. Kelemahan Zhuangzi: ia piawai melarutkan kekakuan, tetapi tak membangun apa-apa. Orang yang hanya membaca Zhuangzi bisa menjadi bebas sekaligus sulit diandalkan.","Ada pula latihan batin bernama <i>puasa pikiran</i>. Sebelum memengaruhi seseorang, berhentilah berbicara pada diri sendiri. Dengarkan tanpa vonis yang sudah disiapkan. Pikiran yang matang, tulis Zhuangzi, bekerja seperti cermin: memantulkan yang datang, tak menyimpannya, sehingga tak lelah oleh ribuan wajah. Dan pohon ek tua yang bengkok serta tak berguna justru hidup paling lama karena tak ditebang. Yang khas melindungi.","<b>Yang bisa dibawa:</b> pertanyakan bingkai Anda, sebab kebanyakan konflik adalah dua orang yang membela dua tempurung. Pelajari sendi masalah dan bekerjalah searah serat. Pelan di titik sulit, cepat di tempat lain. Latih pikiran cermin: tanggapi sepenuhnya, simpan sedikit pun tidak. Sadari pembingkaian, baik saat menyajikan maupun saat disajikan. Lindungi satu hal dalam hidup yang tak dioptimalkan."],
en:["<b>Core idea:</b> what keeps us from flowing is not the world but our frozen views. It has four layers: freedom from any single viewpoint, mastery without force, inner calm, and ease about being useful.","If Lao Tzu whispers, Zhuangzi laughs. He asks what keeps us from flowing like water, and answers: our frozen opinions. The frog in the well cannot imagine the ocean, not because it is stupid, but because the well is the only world it knows.","Cook Ding is the best-known tale. His knife lasted nineteen years because he cut through the gaps in the joints instead of hacking at bone. Experts see the structure of a problem and work with the grain. Then there is the monkey keeper: three chestnuts in the morning, four in the evening, and the monkeys rage. Reverse it, and they cheer. The total stays seven. People often react to packaging, not substance.","The lesson is double: understand how framing works on others, and refuse to be the monkey.","Zhuangzi's favorite device is the change of scale. The great Peng bird flies ninety thousand miles in one flight, and a cicada laughs: why go so far, when the next tree is enough? Neither is wrong from where it sits. So before calling someone foolish, ask what vantage point they see from, and what your own blind spot is. This is the root of every good negotiation and sale. In the story of the fish, Zhuangzi stands on a bridge and says the minnows are happy. Hui Shi, the logician, objects: you are not a fish. Zhuangzi replies: you are not me. Understanding people is more often born of attunement than of argument.","Cook Ding's message has four layers: master the structure, follow the grain, slow down at the hard spot, and know that wear is a cost. If you are burning out, you may be hacking at bone.","In the famous butterfly dream, Zhuang Zhou wakes and asks: am I a man who dreamed he was a butterfly, or a butterfly now dreaming he is a man? You need not settle the riddle. Its practical effect is to loosen the grip of identity and certainty, so we learn more easily and spot opportunities a rigid self would miss. The book's weakness: it dissolves rigidity brilliantly but builds nothing. A reader of Zhuangzi alone may become free and unreliable at once.","There is also an inner practice called the <i>fasting of the mind</i>. Before trying to influence someone, stop talking to yourself. Listen without a prepared verdict. The mature mind, Zhuangzi writes, works like a mirror: it reflects what arrives and keeps nothing, so it is not worn out by a thousand faces. And the gnarled old oak, useless to carpenters, lives longest because no one cuts it down. Distinctiveness protects.","<b>What to take:</b> question your frame, since most conflicts are two people defending two shells. Learn the joints of the problem and work with the grain. Slow down at the hard parts, move quickly elsewhere. Practice the mirror-mind: respond fully, retain nothing. Notice framing, in how you present and in how you are presented to. Protect one thing in your life that is not optimized."]},
{t:"The Analects",k:"論",ti:"Seni Membangun Kepercayaan",
id:["<b>Gagasan inti:</b> masyarakat yang baik tumbuh dari karakter yang baik. Lapisannya enam: <i>ren</i> (kemanusiaan), <i>li</i> (tata krama), teladan sang <i>junzi</i>, kepercayaan, kejelasan bahasa, dan belajar seumur hidup.","Konfusius menanyakan hal yang paling membumi: bagaimana hidup baik bersama orang lain? Jawabannya dimulai dari karakter. Pemimpin ibarat angin, rakyat ibarat rumput. Ketika angin berembus, rumput merunduk. Orang meniru yang mereka lihat, bukan yang mereka dengar.","Ada percakapan yang layak dipajang di meja setiap pengusaha. Murid Konfusius, Zigong, bertanya: jika terpaksa melepas satu dari tiga hal (senjata, pangan, kepercayaan), mana yang dilepas dulu? Senjata, jawab sang guru. Lalu pangan. Kepercayaan dilepas paling akhir, sebab tanpanya manusia tak bisa berdiri.","Dua catatan lain. <i>Meluruskan nama</i>: sebut sesuatu apa adanya, sebab kekacauan organisasi sering bermula dari kata yang kabur. Dan soal uang: Zigong sendiri pedagang yang ramalan pasarnya sering tepat, dan sang guru tak menolaknya. Laba bukan musuh. Laba sebagai satu-satunya kompas itulah masalahnya.","Kalimat pertama kitab ini tentang belajar: mempelajari sesuatu dan melatihnya pada waktunya, bukankah itu kegembiraan? Konfusius menganggap dirinya murid. Bila tiga orang berjalan bersama, selalu ada satu yang bisa menjadi guru: kebaikannya ditiru, keburukannya menjadi cermin koreksi diri. Kemampuan terus belajar adalah akar semua kemampuan lain. Dan di tepi sungai ia berkata bahwa segalanya berlalu seperti ini, siang dan malam tanpa henti. Jalan Konfusian bukan lompatan dramatis, melainkan perbaikan harian yang sabar, seperti air yang tak pernah berhenti.","Kepercayaan melampaui sumber daya. Perusahaan tanpa kas tetapi bernama bersih bisa pulih. Perusahaan berkas penuh tetapi nama hancur sudah mulai mati. Pemerintah, merek, persahabatan, pernikahan: semuanya bertahan dari hampir semua kekurangan, kecuali hilangnya kepercayaan.","Soal kepemimpinan ada satu kalimat yang mudah terlewat: bila pemimpin lurus pada dirinya sendiri, perintah tak perlu diberikan. Bila tidak, ia boleh memerintah sepanjang hari tanpa ada yang menurut. Bacalah juga dengan jujur bahwa kitab ini konservatif: ia menengok masa lalu yang diidealkan dan menaruh bobot besar pada hierarki. Lao Tzu menjawab bahwa ritual lahir ketika ketulusan memudar. Keberatan itu sah, dan akan kita pertemukan di bab benturan.","Konfusius juga memberi cara membaca orang dalam tiga lapis: lihat perbuatannya, selidiki motifnya, perhatikan apa yang membuatnya nyaman. Lapis pertama bisa dipalsukan semalam, lapis ketiga tidak. Kebajikan utamanya, <i>ren</i>, berpangkal pada aturan emas versi negatif: jangan lakukan pada orang lain apa yang tak ingin Anda alami. Adapun tata krama (<i>li</i>) bukan hiasan, melainkan bahasa yang membuat rasa hormat terlihat.","<b>Yang bisa dibawa:</b> taruh kepercayaan di urutan pertama. Pimpin dengan menjadi teladan. Hormat dalam bentuk dan dalam perasaan sekaligus. Sebutlah sesuatu apa adanya. Baca orang dalam tiga lapis: perbuatan, motif, dan apa yang membuatnya nyaman. Teruslah belajar dari siapa pun yang Anda temui."],
en:["<b>Core idea:</b> a good society grows from good character. It has six layers: <i>ren</i> (humaneness), <i>li</i> (propriety), the example of the <i>junzi</i>, trust, clarity of language, and lifelong learning.","Confucius asks the most down-to-earth question: how do we live well among other people? His answer starts with character. A leader is the wind and the people are the grass. When the wind blows, the grass bends. People copy what they see, not what they hear.","One exchange deserves a spot on every founder's desk. His student Zigong asks: if you had to give up one of three things (weapons, food, trust), which goes first? Weapons, says the teacher. Then food. Trust goes last, because without it people cannot stand at all.","Two more notes. <i>Rectify the names</i>: say what things are, since organizational chaos often begins with vague words. And on money: Zigong was a merchant whose market forecasts often hit, and his teacher did not reject him. Profit is not the enemy. Profit as the only compass is.","The book's first line is about learning: to learn and practice it in due time, is that not a joy? Confucius saw himself as a student. When three people walk together, one can always be a teacher: imitate their good, correct yourself by their faults. The ability to keep learning is the root of every other ability. And by a river he says things pass on like this, day and night without ceasing. The Confucian way is no dramatic leap but patient daily improvement, like water that never stops.","Trust outranks resources. A firm with no cash but a spotless name can recover. A firm with plenty of cash and a ruined name has already begun to die. Governments, brands, friendships, marriages: all survive almost any shortage except the loss of trust.","On leadership there is one easily missed line: if a leader is correct in himself, orders need not be given. If not, he can command all day and no one will comply. Read the book honestly, too: it is conservative, looking back to an idealized past and putting heavy weight on hierarchy. Lao Tzu answers that ritual appears when sincerity withers. That objection is fair, and we will meet it in the chapter on clashes.","Confucius also offers a three-layer way to read people: look at what they do, probe their motives, notice what they are comfortable with. The first layer can be faked overnight, the third cannot. His core virtue, <i>ren</i>, rests on the negative Golden Rule: do not impose on others what you would not want imposed on yourself. And etiquette (<i>li</i>) is no decoration but the language that makes respect visible.","<b>What to take:</b> put trust first. Lead by being. Respect in form and in feeling. Say what things are. Read people in three layers: behavior, motive, and what they are comfortable with. Keep learning from everyone you meet."]},
{t:"Guanzi",k:"管",ti:"Ekonomi Hati Manusia",
id:["<b>Gagasan inti:</b> memengaruhi dunia dimulai dari menguasai pikiran sendiri, lalu memahami keinginan manusia, lalu merancang kondisi tempat mereka bergerak. Kitab ini berlapis empat: batin (<i>Neiye</i>, <i>Xinshu</i>), manusia (<i>Mu Min</i>), pasar (<i>Qing Zhong</i>), dan penyatuan ketiganya.","Inilah kitab yang membedakan sintesis ini. Guan Zhong adalah perdana menteri negeri Qi yang wafat pada 645 SM, tetapi bukunya disusun jauh sesudahnya oleh banyak tangan. Anggap isinya kearifan sebuah mazhab, bukan arsip pengadilan.","Wajah pertamanya adalah batin. Bab <i>Neiye</i> dan <i>Xinshu</i> mengajarkan bahwa pikiran yang tenang melihat jernih, dan mengatur diri sama dengan mengatur negara pada skala berbeda. Wajah keduanya adalah manusia. Bab <i>Mu Min</i> berkata: ketika lumbung penuh, orang paham sopan santun. Beri apa yang mereka inginkan, singkirkan yang mereka benci. Memberi adalah jalan menerima.","Wajah ketiganya adalah pasar. Lewat <i>Qing Zhong</i>, nilai dipandang naik-turun mengikuti kelangkaan. Dalam kisah sutra, Qi mengenakan sutra dari Lu dan Liang, petani dua negeri itu meninggalkan padi demi menenun, lalu Qi menutup perdagangan dan menahan beras. Mereka kelaparan dan menyerah tanpa satu pertempuran. Para sarjana menduga kisah ini ditulis belakangan, jadi bacalah sebagai studi kasus tentang insentif, bukan sejarah.","Klaim inti <i>Neiye</i> ada lima. Dalam diri ada energi halus bernama <i>jing</i>: bila terkumpul, orang jernih dan cakap, bila tercerai oleh amarah, cemas, atau nafsu, orang menjadi tumpul. Tenangkan emosi, makan secukupnya, tegakkan badan. Di bawah ocehan pikiran ada pikiran di dalam pikiran, kesadaran stabil yang melihat akurat. Bersihkan rumah batin, dan yang Anda cari datang menetap. Terakhir, tertib di dalam melahirkan tertib di luar: pikiran adalah penguasa, pancaindra adalah pejabat, dan penguasa yang tak mengganggu tugas para pejabat membuat semuanya berjalan. Inilah keterampilan yang sama pada dua skala.","<i>Qing Zhong</i> bertumpu pada empat prinsip: beli saat murah dan jual saat langka, kuasai barang esensial seperti pangan, garam, dan besi, sadari bahwa kelangkaan dan kelimpahan mengubah perilaku, dan utamakan insentif ketimbang perintah. Kisah sutra dan rusa memperlihatkan empat alatnya: mode dan gengsi, sinyal harga, ketergantungan, dan waktu. Semuanya masih kita jumpai hari ini sebagai merek mewah, gelembung spekulasi, dan ketergantungan pada satu platform.","Inilah sebabnya Guanzi muncul dua kali dalam sintesis ini. Wajah batinnya (<i>Neiye</i>, <i>Xinshu</i>) berdiri di dasar tangga, bersebelahan dengan Lao Tzu dan Zhuangzi. Wajah luarnya (<i>Mu Min</i>, <i>Qing Zhong</i>) berdiri di tengah, menjembatani karakter dan strategi. Para pemikir Qi tak memisahkan perenungan dari ekonomi. Mereka melihatnya sebagai satu keterampilan: yang mampu mengatur pikirannya sendiri mampu membaca pikiran orang lain, dan yang mampu membaca pikiran orang lain mampu merancang insentif mereka. Kerja batin bukan pelarian dari pasar. Ia fondasi tersembunyinya.","<i>Mu Min</i> berkata pemerintahan berjalan bila sejalan dengan hati rakyat dan gagal bila menentangnya. Orang tak suka bersusah payah, maka beri kemudahan. Mereka tak suka miskin dan hina, maka beri kemakmuran dan kehormatan. Mereka tak suka bahaya, maka beri rasa aman. Mereka tak suka terputus dari keturunan, maka beri kesinambungan. Hukuman tak cukup menggetarkan hati. Bacalah ini sebagai teori memengaruhi massa yang masih modern: produk menang karena menghapus rasa sakit nyata, pemimpin menang karena pengikut melihat kepentingannya sendiri dalam arah sang pemimpin, negosiasi menang karena tiap pihak melihat apa yang ia dapat.","Dua kata menjadi nama bab-bab ekonominya: <i>qing</i> (ringan) dan <i>zhong</i> (berat). Barang yang murah karena melimpah itu ringan, yang mahal karena langka itu berat. Wawasan intinya: nilai tidak tetap. Ia naik-turun mengikuti pasokan dan keinginan orang, dan orang cerdik bisa memanfaatkannya. Lumbung negara dipakai persis begitu: membeli gabah saat panen raya, melepasnya saat paceklik, sehingga harga pangan stabil. Gagasan ini bergema sepanjang sejarah Tiongkok hingga kebijakan stok penyangga modern.","Empat tali moral menegakkan masyarakat: kepatutan, kebenaran, integritas, dan rasa malu. Bila satu putus, bangunan miring. Bila keempatnya putus, runtuh. <i>Mu Min</i> juga memuat empat larangan yang berguna bagi perencana mana pun: jangan memulai yang tak bisa diselesaikan, jangan mengejar yang tak bisa diperoleh, jangan bertahan di tempat yang tak bisa dipertahankan, jangan melakukan yang tak bisa diulang. Singkatnya, jangan menjanjikan berlebihan.","Kisah rusa dari Chu mengikuti pola yang sama. Harga rusa dilambungkan, rakyat Chu meninggalkan ladang untuk berburu, lalu pembelian dihentikan. Prinsip dasarnya: beli saat murah dan terabaikan, lepas saat langka dan diminati.","<b>Yang bisa dibawa:</b> mulailah dari perhatian Anda sendiri. Penuhi kebutuhan sebelum menuntut kebajikan. Beri dulu. Temukan apa yang orang inginkan dan takutkan, lalu selaraskan tawaran Anda secara jujur. Utamakan insentif ketimbang perintah. Berpikirlah dalam siklus. Jangan menjanjikan berlebihan.","<b>Batasnya:</b> logika mengendalikan pasokan dan permintaan bisa tergelincir menjadi manipulasi, dan kisah-kisah di atas, dari sudut korban, adalah perang ekonomi. Perdebatan Garam dan Besi tahun 81 SM menanyakan persis ini: apakah pengaturan harga oleh negara adalah pengelolaan bijak atau campur tangan yang mencekik usaha swasta."],
en:["<b>Core idea:</b> influencing the world begins with mastering your own mind, then understanding human desire, then designing the conditions in which people move. The book has four layers: the mind (<i>Neiye</i>, <i>Xinshu</i>), people (<i>Mu Min</i>), the market (<i>Qing Zhong</i>), and the union of all three.","This is the book that sets this synthesis apart. Guan Zhong was chief minister of Qi, who died in 645 BCE, but the book was compiled long after him by many hands. Treat its contents as the wisdom of a school, not a courtroom record.","Its first face is the inner mind. The chapters <i>Neiye</i> and <i>Xinshu</i> teach that a quiet mind sees clearly, and that governing yourself is the same skill as governing a state at a different scale. Its second face is people. <i>Mu Min</i> says: when the granaries are full, people learn manners. Give them what they want, remove what they dislike. Giving is the way of receiving.","Its third face is the market. In <i>Qing Zhong</i>, value rises and falls with scarcity. In the silk tale, Qi wore silk from Lu and Liang, farmers there abandoned grain to weave, then Qi closed trade and held back its rice. They starved and submitted without a single battle. Scholars suspect the tale is later, so read it as a case study in incentives, not as history.","The core claims of <i>Neiye</i> are five. Inside you is a refined energy called <i>jing</i>: gathered, it makes a person clear and capable, scattered by anger, anxiety, or craving, it makes them dull. Calm the emotions, eat moderately, keep the body upright. Beneath the chatter of thought lies a mind within the mind, a steady awareness that sees accurately. Tidy the inner house and what you seek comes to stay. Finally, order within produces order without: the mind is the ruler, the senses are officials, and a ruler who does not interfere with the officials' work lets everything run. It is the same skill at two scales.","<i>Qing Zhong</i> rests on four principles: buy when cheap and sell when scarce, control essential goods like grain, salt, and iron, recognize that scarcity and abundance change behavior, and prefer incentives to orders. The silk and deer tales show four tools: fashion and status, price signals, dependency, and timing. All are still with us as luxury brands, speculative bubbles, and platform dependency.","This is why Guanzi appears twice in the synthesis. Its inner face (<i>Neiye</i>, <i>Xinshu</i>) stands at the base of the ladder beside Lao Tzu and Zhuangzi. Its outer face (<i>Mu Min</i>, <i>Qing Zhong</i>) stands in the middle, bridging character and strategy. The thinkers of Qi did not separate contemplation from economics. They saw one skill: whoever can govern their own mind can read other minds, and whoever can read other minds can design their incentives. Inner work is not a retreat from the market. It is the market's hidden foundation.","<i>Mu Min</i> says governing works when it accords with the people's hearts and fails when it opposes them. People dislike toil, so give them ease. They dislike poverty and lowliness, so give them wealth and honor. They dislike danger, so give them safety. They dislike being cut off from descendants, so give them continuity. Punishment alone does not move hearts. Read this as a theory of mass influence that still feels modern: a product wins by removing a real pain, a leader wins when followers see their own interest in the leader's direction, a negotiation wins when each side sees what it gains.","Two words name the economic chapters: <i>qing</i> (light) and <i>zhong</i> (heavy). Goods cheap because abundant are light, goods dear because scarce are heavy. The core insight: value is not fixed. It rises and falls with supply and desire, and a clever person can use that. State granaries worked exactly so: buying grain at the harvest glut, releasing it in lean seasons, stabilizing food prices. The idea echoes through Chinese history to modern buffer-stock policy.","Four moral cords hold a society upright: propriety, righteousness, integrity, and a sense of shame. If one snaps, the structure tilts. If all four snap, it falls. <i>Mu Min</i> also lists four restraints useful to any planner: do not undertake what cannot be completed, do not seek what cannot be obtained, do not settle where you cannot remain, do not do what cannot be repeated. In short, do not over-promise.","The deer of Chu follows the same pattern. The price of deer is inflated, the people of Chu abandon their fields to hunt, then the buying stops. The underlying rule: buy when cheap and ignored, release when scarce and wanted.","<b>What to take:</b> start with your own attention. Meet needs before demanding virtue. Give first. Find what people want and fear, and align your offer honestly. Use incentives before orders. Think in cycles. Do not over-promise.","<b>The limits:</b> the logic of controlling supply and demand can slide into plain manipulation, and the tales above are, from the victims' side, economic warfare. The 81 BCE debate on Salt and Iron asked exactly this: is state price-steering wise stewardship, or heavy-handed interference that stifles private enterprise?"]},
{t:"The Art of War",k:"兵",ti:"Menang Sebelum Bertempur",
id:["<b>Gagasan inti:</b> menang dengan biaya serendah mungkin, idealnya sebelum pertempuran dimulai. Lapisannya enam: perhitungan, siasat, daya posisi (<i>shi</i>), kelenturan seperti air, intelijen, dan pengendalian diri sang pemimpin.","Kemenangan tertinggi, kata Sun Tzu, adalah menaklukkan lawan tanpa bertempur. Urutan siasatnya dari yang terbaik: gagalkan rencana lawan, putus sekutunya, baru hadapi pasukannya. Mengepung kota adalah pilihan terburuk, mahal dan berdarah.","Kenali dirimu dan kenali lawanmu. Kebanyakan orang gagal di bagian pertama: terlalu percaya diri. Lalu ada <i>shi</i>, kekuatan posisi, seperti batu bundar di puncak gunung yang cukup dilepas, tanpa perlu didorong. Dan di bab enam, pasukan disamakan dengan air: bentuknya mengikuti medan, kemenangannya mengikuti lawan.","Dua pesan lain terasa modern. Intelijen adalah investasi termurah, dan perang berlarut-larut menguras negara yang sedang menang. Satu lagi, jangan memutuskan dalam keadaan marah, sebab negara yang hancur tak bisa dihidupkan kembali.","Bab enam memuat gagasan paling indah. Serang yang kosong, hindari yang penuh. Buat lawan datang kepada Anda, bukan sebaliknya. Pasukan seperti air: menjauhi tempat tinggi dan mengalir ke yang rendah, bentuknya mengikuti medan, kemenangannya mengikuti lawan. Yang mampu menang dengan berubah menyesuaikan lawan disebut ilahi. Maka jangan mengunci metode di muka. Punyalah tujuan, biarkan keadaan menentukan jalan. Sun Tzu juga melukiskan jenderal ideal: maju tanpa mengejar nama, mundur tanpa takut aib, hanya ingin melindungi rakyatnya. Prajurit diperlakukan seperti anak sendiri, tetapi kebaikan tanpa disiplin melahirkan pasukan manja.","Bab terakhir menegur penguasa yang menggelontorkan dana untuk pasukan tetapi pelit membiayai intelijen, dan menyebutnya tak berperikemanusiaan, sebab nyawa ribuan dipertaruhkan demi menghemat biaya kecil. Riset pasar, wawancara pelanggan, uji tuntas, dan sumber jujur di dalam organisasi adalah bentuk modernnya. Bab kedua menghitung ongkos perang dengan teliti: perang berlarut menguras negara, maka laju pembakaran kas adalah fakta strategis.","Letak Sun Tzu dalam sintesis ini adalah anak tangga paling atas, dan itu penting. Ia mengandaikan pasukan, kas, dan struktur politik sudah ada, tanpa menjelaskan dari mana kekayaan berasal atau mengapa orang mau mengikuti. Ahli siasat bergantung pada ahli ekonomi dan pembangun karakter. Karena itu Sun Tzu sering disalahpahami sebagai poster motivasi kekejaman, padahal nadanya justru menahan diri: kemenangan terbaik adalah yang paling murah.","Sebelum bertindak, hitung lima faktor: tujuan bersama (<i>dao</i>), waktu, medan, kepemimpinan, dan organisasi. Pihak yang menghitung lebih cermat menang. Perang adalah jalan tipu daya: tampak lemah saat kuat, tampak jauh saat dekat, umpan dipasang agar lawan keluar. Tetapi catat batasnya. Tipu daya ditujukan pada lawan dalam laga yang nyata, bukan pada sekutu atau pasukan sendiri. Dan karena perang panjang menguras kas, memutuskan cepat dan tegas adalah bentuk penghematan.","<b>Yang bisa dibawa:</b> hitung sebelum berkomitmen. Pilih anak tangga atas: gagalkan rencana, amankan sekutu, baru bertarung. Kenali diri sendiri dengan jujur. Bentuk persepsi lawan, bukan mitra. Hitung biaya menunda. Bangun momentum lewat posisi. Tetap tanpa bentuk. Berinvestasilah pada informasi. Jangan pernah memutuskan dalam amarah.","<b>Batasnya:</b> kitab ini sering dipakai sebagai poster pembenaran kekejaman, padahal nadanya menahan diri."],
en:["<b>Core idea:</b> win at the lowest possible cost, ideally before the fight begins. It has six layers: calculation, deception, positional power (<i>shi</i>), water-like flexibility, intelligence, and the commander's self-control.","The supreme victory, says Sun Tzu, is to subdue the enemy without fighting. His ranking of strategies runs from best to worst: defeat their plans, cut their alliances, only then face their army. Besieging cities is the worst option, costly and bloody.","Know yourself and know your opponent. Most people fail at the first half: overconfidence. Then there is <i>shi</i>, the power of position, like a round stone at the top of a mountain that needs releasing, not pushing. In chapter six, an army is compared to water: its shape follows the terrain, its victory follows the enemy.","Two more messages feel modern. Intelligence is the cheapest investment, and a drawn-out war drains even the winning state. One more: never decide in anger, because a destroyed state cannot be revived.","Chapter six holds the most beautiful idea. Strike where the enemy is empty, avoid where they are full. Make the opponent come to you instead of being drawn by them. An army is like water: it avoids the heights and rushes to the low, its shape follows the terrain, its victory follows the enemy. One who wins by changing and adapting to the opponent is called divine. So do not fix your method in advance. Have a goal, let the situation choose the path. Sun Tzu also paints the ideal general: advancing without seeking fame, retreating without fearing disgrace, wanting only to protect his people. Soldiers are treated like beloved children, but kindness without discipline makes a spoiled army.","The final chapter scolds rulers who pour money into armies yet starve intelligence, calling it inhumane, since thousands of lives are risked to save a trivial expense. Market research, customer interviews, due diligence, and honest sources inside your own organization are its modern forms. The second chapter counts the cost of war carefully: long campaigns drain the state, so burn rate is a strategic fact.","Sun Tzu's place in this synthesis is the top rung, and that matters. He assumes an army, a treasury, and a political structure already exist, without explaining where wealth comes from or why people follow. The strategist depends on the economist and the character-builder. That is why Sun Tzu is so often misread as a poster for ruthlessness, when his tone is restraint: the best victory is the cheapest one.","Before acting, weigh five factors: shared purpose (<i>dao</i>), timing, terrain, leadership, and organization. The side that calculates more thoroughly wins. War is the way of deception: appear weak when strong, far when near, set bait to draw the enemy out. But note the boundary. Deception is aimed at an adversary in a genuine contest, never at allies or your own troops. And because long wars drain the treasury, deciding quickly and firmly is a form of economy.","<b>What to take:</b> calculate before committing. Prefer the higher rungs: defeat plans, secure alliances, only then fight. Know yourself honestly. Shape the perception of an opponent, never a partner. Count the cost of delay. Build momentum through position. Stay formless. Invest in information. Never decide in anger.","<b>The limits:</b> the book is often used as a poster to justify ruthlessness, when its tone is restraint."]},
{t:"What They Agree On",ti:"Yang Mereka Sepakati",
id:["Di balik perbedaannya, kelima kitab sepakat pada lima hal. <b>Lihat kenyataan dulu, baru bertindak.</b> Semuanya berawal dari persepsi. <b>Hemat tenaga.</b> <i>Wu wei</i>, pisau Koki Ding, bintang kutub, insentif ketimbang perintah, dan kemenangan tanpa tempur adalah variasi satu prinsip: usaha terbaik adalah yang tak perlu dikerjakan.","<b>Batin menentukan hasil.</b> Pikiran jernih melihat akurat, dan itu fondasi segalanya. <b>Lentur mengalahkan kaku.</b> Air, kupu-kupu, harga yang bersiklus, dan pasukan tanpa bentuk mengatakan hal yang sama. <b>Pengaruh tertinggi bersifat tak langsung.</b> Pemimpin yang nyaris tak terasa, angin di atas rumput, penguasa yang memberi apa yang diinginkan rakyat, jenderal yang menang tanpa bertempur."],
en:["Beneath their differences, the five books agree on five things. <b>See reality first, then act.</b> Everything begins with perception. <b>Economy of effort.</b> <i>Wu wei</i>, Cook Ding's knife, the pole star, incentives over orders, and the unfought victory are variations of one principle: the best effort is the one you do not have to make.","<b>The inner state shapes the result.</b> A clear mind sees accurately, and that is the foundation of everything. <b>Adaptability beats rigidity.</b> Water, the butterfly, the price cycle, and the formless army say the same thing. <b>The highest influence is indirect.</b> The barely noticed leader, wind over grass, the ruler who gives people what they want, the general who wins without fighting."]},
{t:"Where They Clash",ti:"Di Mana Mereka Berbenturan",
id:["Kelima kitab ini tidak selalu akur, dan sintesis yang jujur tak menutupinya. Menipu atau memercayai? Sun Tzu menyebut perang sebagai tipu daya, Konfusius menjadikan kepercayaan fondasi. Jalan tengahnya: kaburkan niat terhadap lawan dalam pertarungan yang nyata, tetapi jangan pernah menipu mitra, pelanggan, atau timmu. <b>Sulit dibaca, jangan sulit dipercaya.</b>","Mengendalikan atau membiarkan? Guanzi mengatur harga dan lumbung, Lao Tzu bilang jangan terlalu sering membolak-balik ikan kecil. Cerita Yu Agung memberi jawabnya. Ayahnya membendung banjir dan bendungnya jebol. Yu justru menggali saluran dan mengarahkan air ke laut. Perancang insentif yang baik menggali parit, bukan membendung manusia.","Berjuang atau tak berjuang? Lao Tzu dan Zhuangzi mencurigai ambisi, sedangkan Guanzi dan Sun Tzu dibangun di atas tujuan. Pegang tujuan seperti air memegang muara: ia mengalir ke laut, tetapi tak memaksa jalur tertentu. Berusahalah tanpa mencengkeram. Ambisi menjadi masalah ketika ego membutuhkan hasil tertentu, dalam bentuk tertentu, pada waktu tertentu.","Ritual atau spontan? Konfusius membangun kepercayaan lewat kesopanan baku. Lao Tzu berkata ritual lahir ketika kesetiaan sejati layu. Jadikan bentuk sebagai bejana ketulusan, bukan penggantinya, dan periksa berkala apakah ketulusan itu masih ada di dalamnya.","Laba atau integritas? Keduanya lebih akur dari kelihatannya. Kekayaan adalah fondasi, integritas adalah pagarnya."],
en:["These five books do not always agree, and an honest synthesis does not hide that. Deceive or trust? Sun Tzu calls war deception, Confucius makes trust the foundation. The middle path: conceal your intent from a genuine adversary, but never deceive partners, customers, or your own team. <b>Be hard to read, never hard to trust.</b>","Control or let be? Guanzi manages prices and granaries, Lao Tzu says do not keep flipping a small fish. The story of Yu the Great answers it. His father dammed the floods and the dams burst. Yu dug channels and guided the water to the sea. A good incentive designer digs channels instead of damming people.","Strive or not strive? Lao Tzu and Zhuangzi distrust ambition, while Guanzi and Sun Tzu are built on goals. Hold your goal the way water holds its destination: it flows to the sea, but does not insist on a particular path. Strive without clutching. Ambition becomes a problem when the ego needs a particular result, in a particular form, at a particular time.","Ritual or spontaneity? Confucius builds trust through formal courtesy. Lao Tzu says ritual appears when real loyalty withers. Let forms be vessels for sincerity, not substitutes, and check regularly whether the sincerity is still inside.","Profit or integrity? They agree more than they seem to. Wealth is the foundation, integrity is the railing."]},
{t:"The Ladder of Influence",ti:"Tangga Pengaruh",rungs:1,
id:["Susun kelimanya, dan pertentangan tadi berubah menjadi tangga. Setiap anak tangga bertumpu pada yang di bawahnya.","Coba lompati urutannya. Posisi tanpa ketenangan adalah agresi yang digerakkan rasa takut. Insentif tanpa kepercayaan hanyalah suap, dan berhenti bekerja begitu uangnya berhenti. Kepercayaan tanpa kelenturan adalah kesetiaan keras kepala pada rencana yang sudah tak masuk akal. Kelenturan tanpa ketenangan hanyalah kegelisahan yang menyamar sebagai adaptasi."],
en:["Arrange all five in order and the clashes become a ladder. Each rung rests on the one beneath it.","Try skipping the order. Position without stillness is aggression driven by fear. Incentive without trust is bribery, and stops working the moment the money does. Trust without flexibility is stubborn loyalty to a plan that no longer makes sense. Flexibility without stillness is restlessness dressed up as adaptability."],
r:[["Stillness","Tao Te Ching · Neiye","Bisakah saya melihat jernih?","Can I see clearly?"],["Flexibility","Zhuangzi","Bisakah saya melihat dari tempat lain?","Can I see from other places?"],["Trust","The Analects","Maukah orang mengikuti saya?","Will people follow me?"],["Incentive","Guanzi","Maukah orang bergerak?","Will people want to move?"],["Position","The Art of War","Apakah hasilnya sudah ditentukan sebelum mulai?","Is the outcome decided before we begin?"]]},
{t:"The Ladder in Motion",ti:"Tangga dalam Gerak",rungs:1,
id:["Rina memimpin perusahaan perangkat lunak berisi dua belas orang. Klien terbesarnya mendadak menuntut potongan harga 25 persen, atau pindah ke pesaing. Beginilah lima anak tangga bekerja.","Perhatikan yang tak terjadi: ia tak mengancam, menipu, atau menjilat. Sebagian besar pekerjaan selesai sebelum negosiasi dimulai."],
en:["Rina runs a twelve-person software company. Her largest client suddenly demands a 25 percent price cut or it will move to a rival. Here is how the five rungs work.","Notice what did not happen: she did not threaten, deceive, or grovel. Most of the work was done before the negotiation began."],
r:[["Stillness","Rina","Reaksi pertamanya marah dan takut. Ia menunda balasan sehari, menulis apa yang benar-benar terjadi terpisah dari dugaannya, dan sadar kecemasan sedang mendorongnya menyerah atau membanting pintu. Keduanya reaksi, bukan keputusan.","Her first reaction is anger and fear. She delays her reply a day, writes down what actually happened apart from what she assumes, and notices anxiety pushing her to cave or storm off. Both are reactions, not decisions."],["Flexibility","Rina","Ia bertanya dari sudut mana klien melihat masalah. Tim pengadaan diperintahkan menghemat di semua vendor, jadi ini bisa soal tekanan internal, bukan produknya. Ia juga memeriksa titik butanya sendiri: mungkin ia menganggap klien itu tak tersentuh, padahal bahaya sebenarnya adalah ketergantungannya.","She asks what vantage point the client sees from. Procurement was told to cut costs across all vendors, so this may be internal pressure, not her product. She also checks her own blind spot: perhaps she treats this client as untouchable, when the real risk is her dependence."],["Trust","Rina","Dua belas tahun pengiriman yang andal. Ia menelepon kepala operasional, bukan pengadaan, dan menyampaikan apa adanya apa yang ia hargai dan apa yang tak bisa ia berikan. Tanpa sandiwara, tanpa agenda tersembunyi.","Twelve years of reliable delivery. She calls the head of operations, not procurement, and says plainly what she values and what she cannot give. No theatrics, no hidden agenda."],["Incentive","Rina","Pengadaan butuh angka penghematan, operasional takut migrasi yang kacau. Ia merancang tawaran: diskon moderat dengan kontrak lebih panjang plus layanan tambahan yang sudah lama diinginkan tim klien. Itulah menggali saluran, bukan membangun bendungan.","Procurement needs a savings figure, operations fears a messy migration. She designs an offer: a modest discount tied to a longer contract plus a service the client's team has long wanted. That is digging a channel, not building a dam."],["Position","Rina","Diam-diam ia sudah mengurangi ketergantungan dengan menggarap dua klien menengah, dan mempelajari tawaran pesaing serta biaya pindah. Posisinya lebih kuat daripada dugaan klien. Jika klien tetap pergi, ia kehilangan satu klien, bukan perusahaan.","Quietly she has already reduced dependence by developing two mid-size clients, and studied the rival's offer and the cost of switching. Her position is stronger than the client realizes. If the client still leaves, she loses a client, not the company."]]},
{t:"Putting It to Work",ti:"Menerapkannya",rungs:1,
id:["Tangga ini bisa dilatih. Satu langkah kecil per anak tangga sudah cukup, karena konsistensi mengalahkan intensitas."],
en:["The ladder can be trained. One small step per rung is enough, because consistency beats intensity."],
r:[["Stillness","Practice","Duduk tenang sepuluh menit tiap hari. Tarik sepuluh napas sebelum membalas atau memutuskan di tengah emosi. Pisahkan apa yang Anda lihat dari apa yang Anda tafsirkan.","Sit quietly ten minutes a day. Take ten breaths before replying or deciding in the heat of emotion. Separate what you saw from what you interpreted."],["Flexibility","Practice","Tanyakan: apa titik buta saya, dan bagaimana ini tampak dari sudut orang lain? Sebelum mengkritik, tulis versi terkuat gagasan lawan. Sisakan satu kegiatan tanpa target.","Ask: what is my blind spot, and how does this look from where others stand? Before criticizing, write the strongest version of the other idea. Keep one pursuit with no target."],["Trust","Practice","Hitung janji kecil yang Anda buat dan tepati selama seminggu. Tulis satu kalimat tentang peran dan arti selesai di tiap proyek. Ucapkan terima kasih secara spesifik.","Count the small promises you make and keep for a week. Write one sentence on roles and what done means in each project. Say thank you specifically."],["Incentive","Practice","Buat peta keinginan dan ketakutan orang yang ingin Anda pengaruhi. Gali saluran: jadikan perilaku yang diinginkan jalur termudah. Beri dulu sebelum meminta.","Map the wants and fears of the person you want to influence. Dig a channel: make the desired behavior the easiest path. Give before you ask."],["Position","Practice","Periksa lima faktor sebelum komitmen besar. Tanyakan apakah rencana lawan bisa digagalkan lebih dulu. Sisihkan waktu untuk mendengar pelanggan dan pasar.","Check the five factors before a major commitment. Ask whether the rival's plan can be defeated first. Set aside time to listen to customers and the market."]]},
{t:"The Water Principle",ti:"Prinsip Air",
id:["Seandainya hanya satu gambar yang Anda ingat, ingatlah ini, sebab seluruh tangga ada di dalamnya.","Air <b>tenang</b> bila tak diusik, dan saat itu ia memantulkan apa yang ada di atasnya. Air <b>lentur</b>, mengikuti bentuk wadah apa pun. Air <b>dipercaya</b>: kota dibangun di sisinya karena ia dapat diandalkan. Air <b>menggerakkan</b>: ia membawa perahu, mengairi sawah, dan memutar penggilingan hanya dengan mengikuti lerengnya. Dan air <b>berposisi</b>: ia menemukan titik terendah dan dinding terlemah, lalu lama-kelamaan mengukir ngarai.","Jadilah air. Bukan dalam arti pasif, melainkan dalam arti bahwa efektivitas Anda lahir dari membaca medan, mengikuti kemiringan, dan bertahan."],
en:["If you remember only one image, remember this, because the whole ladder is inside it.","Water is <b>still</b> when undisturbed, and then it mirrors what is above it. Water is <b>flexible</b>, taking the shape of any container. Water is <b>trusted</b>: cities are built beside it because it is reliable. Water <b>moves things</b>: it carries boats, irrigates fields, and turns mills simply by following its slope. And water <b>positions</b>: it finds the lowest point and the weakest wall, and over time carves a canyon.","Be water. Not in the sense of passivity, but in the sense that your effectiveness comes from reading terrain, following gradients, and persisting."]},
{t:"Business, Negotiation, Leadership",ti:"Bisnis, Negosiasi, Kepemimpinan",
id:["<b>Dalam bisnis.</b> Dari Guanzi: pahami apa yang melimpah dan langka di pasar Anda, termasuk perhatian dan kepercayaan, lalu tetapkan harga dan kemasan sesuai itu. Dari Konfusius: perlakukan tiap janji sebagai setoran ke rekening kepercayaan, dan beri nama jelas pada produk, peran, dan komitmen. Dari Sun Tzu: turuni tangga siasat, jangan masuk perang harga yang tak sanggup Anda bayar. Dari Lao Tzu dan Zhuangzi: benahi masalah kecil lebih awal, sisakan ruang longgar, dan jangan menggantungkan diri pada satu pelanggan. Ingat para petani Lu dan Liang.","<b>Dalam negosiasi.</b> Lima langkah mengikuti tangga. Tenangkan diri dan kenali batas mundur Anda. Berdirilah di posisi lawan dan siapkan argumen terbaiknya. Bangun kepercayaan sejak lima menit pertama. Rancang kesepakatan yang memberi mereka lebih dari yang Anda berikan menurut nilai mereka. Lalu kenali posisi Anda: punya alternatif, informasi, dan rasa waktu. Jangan berbohong soal komitmen.","<b>Dalam kepemimpinan.</b> Jadilah bintang kutub, bukan cambuk. Namai segalanya dengan jelas. Penuhi kebutuhan sebelum menuntut kebajikan, sebab tim yang terus terancam tak akan murah hati atau kreatif. Rancang jalur termudah menuju perilaku yang diinginkan. Jangan terlalu sering membolak-balik ikan kecil itu. Dan berusahalah menjadi kurang dibutuhkan: kerja pemimpin terbaik tampak pada apa yang dikerjakan tim saat ia tak ada."],
en:["<b>In business.</b> From Guanzi: understand what is abundant and scarce in your market, including attention and trust, and price and package accordingly. From Confucius: treat every promise as a deposit in your trust account, and give clear names to products, roles, and commitments. From Sun Tzu: climb down the strategy ladder, and avoid price wars you cannot afford. From Lao Tzu and Zhuangzi: fix small problems early, keep slack, and do not depend on a single customer. Remember the farmers of Lu and Liang.","<b>In negotiation.</b> Five steps follow the ladder. Settle yourself and know your walk-away. Stand in their position and prepare their best argument. Build trust in the first five minutes. Design a deal that gives them more of what they value than it costs you. Then know your position: alternatives, information, and a sense of timing. Never lie about commitments.","<b>In leadership.</b> Be the pole star, not the whip. Name things clearly. Meet needs before demanding virtue, because a team under constant threat will not be generous or creative. Design the path of least resistance toward the behavior you want. Do not keep flipping the small fish. And aim to become less necessary: the best leader's work shows in what the team does in their absence."]},
{t:"A 30-Day Plan",ti:"Rencana 30 Hari",rungs:1,
id:["Empat minggu, satu fokus tiap minggu. Tiap Minggu malam, tanyakan: kapan saya paling reaktif, di mana saya membela posisi alih-alih memahami, dan apakah saya menepati janji kecil?"],
en:["Four weeks, one focus each. Every Sunday evening ask: when was I most reactive, where did I defend a position instead of understanding one, and did I keep my small promises?"],
r:[["Week 1","Stillness","Hening sepuluh menit tiap hari, tiga kali jeda sepuluh napas.","Ten minutes of quiet daily, three ten-breath pauses."],["Week 2","Flexibility","Tulis argumen terbaik melawan satu pendapat Anda sendiri tiap hari.","Write the best argument against one of your own opinions each day."],["Week 3","Trust","Catat janji kecil, perjelas satu peran yang kabur, kirim satu terima kasih tulus.","Log small promises, clarify one vague role, send one sincere thank-you."],["Week 4","Incentive and Position","Susun peta keinginan dan ketakutan, rancang ulang satu proses, lalu uji satu keputusan nyata dengan lima faktor.","Build a want-and-fear map, redesign one process, then test one real decision with the five factors."]]},
{t:"The Conscience of the Toolkit",ti:"Hati Nurani Sang Perangkat",
id:["Perangkat memengaruhi tanpa hati nurani adalah manipulasi. Tiga ujian sederhana dari kitab-kitab ini bisa menjaganya tetap jujur. <b>Ujian Cahaya Siang</b>: sanggupkah saya menjelaskan caranya langsung kepada orangnya tanpa ia merasa dikhianati? <b>Ujian Timbal Balik</b>: relakah saya diperlakukan begitu? <b>Ujian Saluran</b>: apakah saya menggali jalan yang memang ingin mereka tuju, atau memasang perangkap yang pintu keluarnya saya pegang?","Kisah sutra dan rusa pun layak dibaca dari sisi petani. Pelajaran terbaiknya bersifat defensif: jangan menggantungkan hidup pada satu pembeli, satu tren, atau satu cerita.","Beberapa catatan jujur. Ini kitab kuno, bukan hasil laboratorium: perlakukan klaimnya sebagai hipotesis untuk diuji. Tanggal dan penulisnya sering tak pasti, terutama Guanzi. Taktik zaman kota bertembok bisa kurang cocok bagi perusahaan modern, meski prinsipnya biasanya bertahan. Dan tak satu pun dari ini nasihat keuangan, hukum, atau medis."],
en:["A toolkit of influence without a conscience is manipulation. Three simple tests from these books keep it honest. <b>The Daylight Test</b>: could I explain the method to the person themselves without them feeling betrayed? <b>The Reciprocity Test</b>: would I accept this being done to me? <b>The Channel Test</b>: am I digging a path they actually want to take, or setting a trap whose exit I control?","The tales of the silk and the deer deserve a second reading from the farmers' side. Their best lesson is defensive: do not make yourself dependent on a single buyer, a single trend, or a single story.","A few honest limits. These are ancient books, not laboratory results: treat their claims as hypotheses to test. Dates and authorship are often uncertain, especially for Guanzi. Tactics from the age of walled cities may translate poorly to a modern firm, though the principles usually survive. And none of this is financial, legal, or medical advice."]},
{t:"Five Sentences",ti:"Lima Kalimat",
id:["<b>Tenangkan dulu pikiranmu</b>, sebab persepsi adalah alat bagi segalanya. <b>Longgarkan pandangan yang kaku</b>, sebab dunia tak akan muat dalam satu bingkai. <b>Bangun kepercayaan lewat hal kecil</b>, sebab ia aset yang sangat berharga dan harus dijaga sampai akhir. <b>Bentuk kondisinya, bukan orangnya</b>, dengan menggali saluran yang bisa dilalui. <b>Pilih medan dan saatmu</b>, supaya laga sudah nyaris selesai sebelum dimulai.","Dan di atas semuanya, ingatlah sungai di tepi ladang tadi. Anda boleh melawannya dengan karung pasir. Atau membaca kemiringan tanah, membuka parit, dan membiarkan air melakukan apa yang memang dikerjakan air."],
en:["<b>Still your mind first</b>, because perception is the instrument of everything else. <b>Loosen your fixed views</b>, because the world will not fit in a single frame. <b>Earn trust in small things</b>, because it is a priceless asset that must be guarded to the very end. <b>Shape the conditions, not the people</b>, by digging channels they can flow through. <b>Choose your ground and your moment</b>, so the contest is nearly decided before it starts.","And over all of it, remember the stream at the edge of the field. You can fight it with sandbags. Or you can read the slope, open the channel, and let the water do what water does."]},
{t:"Cheat Sheet",ti:"Contekan Ringkas",rungs:1,
id:["Satu halaman untuk dibawa: pertanyaan yang dijawab tiap kitab, dan di mana ia berdiri dalam tangga."],
en:["One page to carry: the question each book answers, and where it stands on the ladder."],
r:[["Tao Te Ching","Rung 1","Bagaimana saya hidup selaras dengan cara kenyataan bekerja?","How do I live in harmony with how things are?"],["Zhuangzi","Rung 2","Bagaimana saya tetap bebas dan lentur?","How do I stay free and adaptable?"],["The Analects","Rung 3","Bagaimana saya hidup baik dan dipercaya di antara orang lain?","How do I live well and be trusted among people?"],["Guanzi","Rung 1 and 4","Bagaimana saya memahami dan membentuk apa yang menggerakkan manusia?","How do I understand and shape what moves people?"],["The Art of War","Rung 5","Bagaimana saya menang dengan biaya terendah?","How do I win at the lowest cost?"]]},
{t:"Eleven Lines to Remember",ti:"Sebelas Baris yang Harus Diingat",rungs:1,
id:["Jika hanya sebelas kalimat yang Anda bawa pulang, bawalah ini."],
en:["If you carry home only eleven sentences, carry these."],
r:[["Tao Te Ching","Water","Air mengalir ke bawah, menyesuaikan diri, dan gigih.","Water goes low, adapts, and persists."],["Tao Te Ching","Emptiness","Ruang kosonglah yang membuat sesuatu berguna.","Empty space is what makes things useful."],["Tao Te Ching","Leadership","Pemimpin terbaik nyaris tak terasa.","The best leader is barely noticed."],["Zhuangzi","Cook Ding","Bekerjalah searah sendi, bukan melawan tulang.","Work with the joints, not against the bone."],["Zhuangzi","Perspective","Setiap pandangan adalah pandangan dari suatu tempat.","Every view is a view from somewhere."],["The Analects","Trust","Kepercayaan adalah hal terakhir yang boleh dilepas.","Trust is the last thing to give up."],["The Analects","Names","Sebutlah sesuatu apa adanya.","Say what things are."],["Guanzi","Neiye","Pikiran yang tenang melihat jernih.","A quiet mind sees clearly."],["Guanzi","Mu Min","Beri orang apa yang mereka inginkan, singkirkan apa yang mereka benci.","Give people what they want and remove what they dislike."],["Guanzi","Mu Min","Memberi adalah jalan menerima.","Giving is the way of receiving."],["The Art of War","Victory","Kemenangan terbaik adalah yang tak memerlukan pertempuran.","The best victory is the one that needs no battle."]]},
{t:"Further Reading",ti:"Bacaan Lanjutan",
id:["Untuk menyimak naskah aslinya, ini terjemahan Inggris yang dihormati. Tao Te Ching: D. C. Lau atau Ursula K. Le Guin. Zhuangzi: Burton Watson atau Brook Ziporyn. The Analects: Edward Slingerland. Guanzi: W. Allyn Rickett, dan Harold Roth (Original Tao) khusus untuk Neiye. The Art of War: Roger Ames atau Samuel Griffith. Dari sisi pedagang, bacalah Shiji bab 129 (Burton Watson) dan Discourses on Salt and Iron."],
en:["To read the originals, these English translations are widely respected. Tao Te Ching: D. C. Lau or Ursula K. Le Guin. Zhuangzi: Burton Watson or Brook Ziporyn. The Analects: Edward Slingerland. Guanzi: W. Allyn Rickett, and Harold Roth (Original Tao) for Neiye. The Art of War: Roger Ames or Samuel Griffith. For the merchant's view, read Shiji chapter 129 (Burton Watson) and Discourses on Salt and Iron."]},
{t:"Footnotes",ti:"Catatan Kaki",
id:["<b>1.</b> <i>Tao Te Ching</i>: sekitar 5.000 aksara dalam 81 bab. Lao Tzu berarti Guru Tua, dan sebagian sarjana meragukan ia sosok sejarah. Teks yang kita kenal kemungkinan berbentuk pada abad ke-4 SM.","<b>2.</b> <i>Zhuangzi</i>: tujuh Bab Dalam diyakini paling dekat dengan Zhuang Zhou sendiri. Sisanya ditambahkan para pengikut.","<b>3.</b> <i>The Analects</i>: dihimpun murid dan murid dari murid Konfusius dalam dua puluh buku, antara abad ke-5 dan ke-3 SM.","<b>4.</b> <i>Guanzi</i>: Guan Zhong wafat 645 SM. Kitabnya dihimpun antara abad ke-4 dan ke-1 SM, dan disunting dalam bentuk akhirnya oleh Liu Xiang. Kaitannya dengan Akademi Jixia di Qi adalah dugaan banyak sarjana.","<b>5.</b> <i>Qing Zhong</i>: bab-babnya kemungkinan ditulis pada masa Han. Kisah sutra dan rusa lebih tepat dibaca sebagai eksperimen pikiran tentang insentif.","<b>6.</b> <i>The Art of War</i>: tiga belas bab, dikaitkan dengan Sun Wu. Bentuk akhirnya kemungkinan terbentuk pada masa Negara-Negara Berperang.","<b>7.</b> Yu Agung: tradisi legendaris Tiongkok. Ayahnya, Gun, gagal membendung banjir. Yu menggali saluran.","<b>8.</b> <i>Discourses on Salt and Iron</i>: perdebatan istana tahun 81 SM tentang monopoli negara melawan usaha swasta, dihimpun oleh Huan Kuan.","<b>9.</b> Semua ide dalam buku ini ditulis ulang dengan kata-kata sendiri, bukan dikutip. Tak satu pun merupakan nasihat keuangan, hukum, atau medis."],
en:["<b>1.</b> <i>Tao Te Ching</i>: about 5,000 characters in 81 chapters. Lao Tzu means Old Master, and some scholars doubt he was a historical figure. The text we know likely took shape in the 4th century BCE.","<b>2.</b> <i>Zhuangzi</i>: the seven Inner Chapters are believed closest to Zhuang Zhou himself. The rest were added by followers.","<b>3.</b> <i>The Analects</i>: compiled by Confucius' students and their students in twenty books, between the 5th and 3rd centuries BCE.","<b>4.</b> <i>Guanzi</i>: Guan Zhong died in 645 BCE. The book was compiled between the 4th and 1st centuries BCE and edited into its final form by Liu Xiang. Its link to the Jixia Academy in Qi is a scholarly conjecture.","<b>5.</b> <i>Qing Zhong</i>: these chapters were probably written in the Han period. The silk and deer tales are best read as thought experiments about incentives.","<b>6.</b> <i>The Art of War</i>: thirteen chapters attributed to Sun Wu. The final form likely took shape in the Warring States period.","<b>7.</b> Yu the Great: Chinese legendary tradition. His father Gun failed by damming the floods. Yu dug channels.","<b>8.</b> <i>Discourses on Salt and Iron</i>: an 81 BCE court debate on state monopoly versus private enterprise, compiled by Huan Kuan.","<b>9.</b> Every idea in this book is rewritten in our own words, not quoted. None of it is financial, legal, or medical advice."]}
];

var book=document.getElementById("book");
S.forEach(function(s,i){
 var sec=document.createElement("section");

 ["id","en"].forEach(function(l){

  if(s.rungs&&s.r){body+='<ol class="rungs">'+s.r.map(function(r){return'<li><b>'+r[0]+'</b><span class="mono" style="font-size:11px">'+r[1]+'</span><br>'+(l=="id"?r[2]:r[3])+'</li>'}).join("")+'</ol>'}
  h+='<div data-l="'+l+'">'+body+'</div>';
 });

var RB_URL="https://oeripoeroep.com";
function buildTOC(){
 var h="<ol>"+S.map(function(s,i){return '<li><a data-i="'+i+'"><span class="n">'+String(i+1).padStart(2,"0")+'</span><span>'+s.t+(s.ti&&lang=="id"?'<small>'+s.ti+'</small>':'')+'</span></a></li>'}).join("")+"</ol>";
 document.getElementById("tocf").innerHTML='<div class="mono">'+(lang=="id"?"Daftar Isi":"Contents")+'</div>'+h;
 document.getElementById("panel").innerHTML=h;
}
document.addEventListener("click",function(e){
 var a=e.target.closest&&e.target.closest("[data-i]"),p=document.getElementById("panel");
 if(a){revealAll();var el=document.getElementById("c"+a.dataset.i);if(el)el.scrollIntoView({behavior:"smooth"});p.hidden=true;return}
 if(e.target.id=="fab"){p.hidden=!p.hidden;return}
 if(e.target.id=="back"){if(RB_URL)location.href=RB_URL;else history.back();return}
 if(!p.contains(e.target))p.hidden=true;
});
function words(l){var n=0;S.forEach(function(s){s[l].forEach(function(p){n+=p.replace(/<[^>]+>/g," ").split(/\s+/).length})});return n}
function apply(l){
 lang=l;document.documentElement.lang=l;
 try{localStorage.setItem("rb-lang",l)}catch(e){}
 document.querySelectorAll("[data-l]").forEach(function(e){if(e.tagName=="DIV")e.hidden=e.dataset.l!==l});
 document.querySelectorAll("#tog button").forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});
 document.getElementById("kicker").textContent=K[l];
 document.getElementById("sub").textContent=SUB[l];
 var tot=Math.max(1,Math.round(words(l)/WPM[l]));
 document.getElementById("rt").textContent="± "+tot+" "+UI[l];buildTOC();
 document.querySelectorAll("section").forEach(function(sec,i){
  var w=0;S[i][l].forEach(function(p){w+=p.replace(/<[^>]+>/g," ").split(/\s+/).length});
  
 });
 place();
}
document.getElementById("tog").onclick=function(e){if(e.target.dataset.l)apply(e.target.dataset.l)};
/* motion line */
var track=document.querySelector(".track"),nodes=[];
function place(){
 nodes.forEach(function(n){n.remove()});nodes=[];
 var H=document.documentElement.scrollHeight;
 document.querySelectorAll("section").forEach(function(sec){
  var n=document.createElement("div");n.className="node";n.style.top=(sec.offsetTop/H*100)+"%";track.appendChild(n);nodes.push(n);
 });
 upd();
}
function upd(){
 var H=document.documentElement.scrollHeight-innerHeight,p=H>0?Math.min(1,Math.max(0,scrollY/H)):0;
 track.style.setProperty("--p",p);
 track.querySelectorAll(".fill,.drop").forEach(function(e){e.style.setProperty("--p",p)});
 var y=(scrollY+innerHeight*.5)/document.documentElement.scrollHeight*100;
 nodes.forEach(function(n){n.classList.toggle("on",parseFloat(n.style.top)<=y)});
 var act=-1;document.querySelectorAll("section").forEach(function(s,i){if(s.getBoundingClientRect().top<150)act=i});
 document.querySelectorAll("#panel a").forEach(function(a,i){a.classList.toggle("on",i==act)});
}
addEventListener("scroll",upd,{passive:true});addEventListener("resize",place);
/* reveal with safety net */
function revealAll(){document.querySelectorAll("section").forEach(function(s){s.classList.add("in")})}
if("IntersectionObserver" in window){
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.01});
 document.querySelectorAll("section").forEach(function(s){io.observe(s)});
}else revealAll();
setTimeout(revealAll,1200);
apply(lang);
</script>
