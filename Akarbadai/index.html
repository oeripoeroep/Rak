se Buddhist monks walked with merchant caravans and answered the questions of people living in uncertainty, far from family, facing danger at every stage of the journey.</p>\n<p>Islam spread to Southeast Asia not primarily through military conquest but through merchants from Gujarat and Arabia stopping at ports across the archipelago. They brought simple monotheism, a relatively egalitarian community, and clear commercial law \u2014 all highly compatible with the needs of maritime societies.</p>\n<div class=\"pull\">What flowed along the Silk Road was not only silk and spice. What flowed were ways of living. Commodities were the medium. Systems of meaning were the message.</div>\n<p>And when two meaning systems met in an open trading environment \u2014 where no authority could impose one version of truth \u2014 what happened was not replacement. What happened was synthesis. Bayt al-Hikmah in Baghdad was a product of Silk Road synthesis: Greek Platonism, Indian mathematics, Persian astronomy, and Islamic revelation meeting in a city cosmopolitan enough to let all of them into dialogue.</p>", "b8": "<p class=\"dropcap\">The Tang Dynasty (618\u2013907 AD) and Song Dynasty (960\u20131279 AD) represent peaks of human civilization. Under the Tang, Chang'an became the world's largest city with about one million inhabitants \u2014 extraordinarily cosmopolitan. Under the Song, China conducted a proto-modern industrial revolution: mass iron production, magnetic compass navigation, paper money, movable type printing four centuries before Gutenberg, and gunpowder used in rudimentary firearms.</p>\n<div class=\"witness\"><div class=\"witness-label\">Eyewitness Record</div><div class=\"witness-name\">Xuanzang \u2014 Great Tang Records on the Western Regions, 646 AD</div><div class=\"witness-route\">Chang'an \u2192 Central Asia \u2192 India, 629\u2013645 AD</div><div class=\"witness-body\">A Chinese Buddhist monk who defied an imperial ban on leaving the country for a sixteen-year journey along the Silk Road to India, seeking original Buddhist scriptures. Six centuries before Pax Mongolica united this route under one authority, Xuanzang proved the Silk Road was already a fully functioning pilgrim and scholarly route \u2014 traveled not by armies, but by a single monk who brought back more than six hundred manuscripts to Chang'an.</div><div class=\"witness-quote\">Xuanzang recorded crossing the Gobi Desert, the freezing Pamirs, and dozens of small kingdoms along the way \u2014 a world already interconnected long before \"globalization\" had any relevance to it.</div></div>\n<p>Song China was not merely wealthy \u2014 it was the most technologically advanced state on earth in its time, far ahead of Europe by nearly every measure. The government-issued jiaozi paper currency system of the 11th century enabled transactions at a scale impossible with metal coinage alone. The imperial examination system rooted in Confucianism \u2014 which we already traced in Chapter III \u2014 reached its full maturity in this era, creating a meritocracy-based bureaucracy far more sophisticated than any feudal system in contemporary Europe. The question that would keep haunting historians: why did a state with so many precursors to the Industrial Revolution never actually experience one?</p>\n<div class=\"commodity\"><div class=\"commodity-label\">Civilizational Commodity</div><div class=\"commodity-title\">Silk \u2014 Two Thousand Years of Monopoly and One Espionage Operation That Changed the World</div><div class=\"commodity-body\">China guarded the secret of the silkworm (Bombyx mori) on pain of death for almost two thousand years. Silk was not merely fabric \u2014 it was diplomatic currency, an unfalsifiable status symbol, and the primary reason the Silk Road existed. Chinese emperors used it as diplomatic gifts to buy peace from threatening nomadic tribes. Pliny the Elder complained that Rome \"drains its wealth for transparent cloth for women.\" The monopoly finally broke around 550 AD when two Nestorian monks smuggled silkworm eggs out of China in hollow bamboo rods \u2014 bringing two millennia of secrecy to Byzantium. Emperor Justinian directly funded this operation: one of the first documented industrial espionage operations in history.</div><div class=\"commodity-quote\">\"[Silk] sold to us at so high a price that women wear garments which make them appear, in public, almost naked.\" \u2014 Pliny the Elder, Naturalis Historia, 77 AD</div></div>\n<p>The answer to Song's technological prosperity came from the steppe to the north. The Mongols, scattered and warring among themselves for centuries, were united by Tem\u00fcjin within a single generation into a force that would conquer a larger territory than any empire before it in human history \u2014 from Korea to Hungary. What set them apart from earlier nomadic waves like the Huns was not merely equestrian mobility, but a willingness to absorb the siege technology of the Chinese and Persian peoples they conquered, transforming a pure cavalry force into a war machine capable of toppling even fortified cities.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 A Pragmatic Military Innovator</div><div class=\"persona-name\">Genghis Khan (Tem\u00fcjin)</div><div class=\"persona-dates\">1162\u20131227 AD \u00b7 Mongolian Steppe</div><div class=\"persona-body\">Created a command system delegating authority to generals chosen on merit, not birth \u2014 radical for his time. Systematically adopted technology from conquered territories. Applied absolute religious tolerance. From the ruins he left arose Pax Mongolica \u2014 the conditions enabling the world's first globalization.</div><div class=\"persona-quote\">\"It is forbidden to kill anyone from any religion. Every person is permitted to worship according to their own belief.\" \u2014 Yasa of Genghis Khan</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The Reverse Marco Polo</div><div class=\"persona-name\">Rabban Sauma</div><div class=\"persona-dates\">1220\u20131294 AD \u00b7 Beijing \u2192 Paris \u2192 Rome</div><div class=\"persona-body\">A Nestorian monk from Beijing who visited Paris and Rome three-quarters of a century before Marco Polo returned from his journey. Almost unknown in Western narratives, yet his journey proved that connections between the extremities of Eurasia were very real in the era of Pax Mongolica.</div><div class=\"persona-quote\">\"We saw the City of Paris... many churches and chapels, great libraries. And the people of that city are very intelligent.\" \u2014 Rabban Sauma, 1287 AD</div></div>\n<div class=\"witness\"><div class=\"witness-label\">Eyewitness Record \u2014 The Reverse of Rabban Sauma</div><div class=\"witness-name\">William of Rubruck \u2014 Itinerarium, 1255 AD</div><div class=\"witness-route\">Constantinople \u2192 Crimea \u2192 Karakorum, 1253\u20131255 AD</div><div class=\"witness-body\">A Franciscan friar sent by King Louis IX of France to visit M\u00f6ngke Khan's court at Karakorum \u2014 the exact reverse of Rabban Sauma's journey from Beijing to Paris three decades later. There, Rubruck personally witnessed an open theological debate hosted by M\u00f6ngke Khan between a Christian priest, a Muslim scholar, and a Buddhist monk \u2014 a forum unimaginable in the Europe of his time, where such a debate would have ended in heresy charges, not state-facilitated discussion.</div><div class=\"witness-quote\">Rubruck recorded M\u00f6ngke Khan telling him: \"We Mongols believe there is only one God... but just as God gave different fingers to the hand, He gave different paths to men.\"</div></div>\n<p>The connectivity Rabban Sauma enjoyed did not last forever. After the Mongol Yuan Dynasty was overthrown and the Chinese Ming Dynasty rose in 1368, China at first continued the tradition of maritime expansion \u2014 even on a scale far grander than anything the Mongols had ever attempted.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The Burned Fleet</div><div class=\"persona-name\">Zheng He</div><div class=\"persona-dates\">1371\u20131433 AD \u00b7 Admiral of the Ming Dynasty</div><div class=\"persona-body\">Muslim Chinese admiral who led seven great expeditions to Southeast Asia, India, Persia, and East Africa \u2014 with a fleet of 300 ships, far surpassing Columbus's scale. Three-quarters of a century before Vasco da Gama, China was already on the East African coast. But the Ming Dynasty then burned his travel records and banned large ship construction \u2014 choosing isolation as state policy. An extraordinarily costly choice.</div><div class=\"persona-quote\">\"We have traversed more than one hundred thousand li of immense ocean and beheld huge waves like mountains.\" \u2014 Zheng He Inscription, 1432 AD</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">The Fall of Baghdad 1258 AD \u2014 A Disaster That Opened Globalization</div></div><div class=\"tb-body\">Hulagu Khan's forces besieged Baghdad. The Caliph was killed. Books from Bayt al-Hikmah were thrown into the Tigris River until the water ran black with ink. The world's largest and most advanced city was leveled in days. Mesopotamia's irrigation systems, built over thousands of years, were destroyed and never fully recovered.</div><div class=\"tb-arrow\"><strong>\u2192 Paradox:</strong> Within one generation, the Mongols transformed. Hulagu's grandson embraced Islam. Pax Mongolica opened the entire Silk Road under one authority. Marco Polo made his journey. And from that freedom of movement arose two things that changed the world: the Black Death (which Pax Mongolica allowed to spread at unprecedented speed), and the seeds of the Age of Exploration.</div></div>\n<p>This chapter shows two faces of the same power: the Pax Mongolica that connected the world from Beijing to Baghdad in a single network of trade and ideas, and the destruction it left behind in every city that refused to submit. The irony that will keep repeating throughout this book appears again here \u2014 the most devastating disaster becomes the catalyst for the most productive cross-continental contact. The next chapter will show how the same contact, this time through a route far shorter and filled with direct violence, brought together two worlds that saw each other as enemies \u2014 yet enriched each other without meaning to.</p>", "b9": "<p class=\"dropcap\">Pope Urban II called for the First Crusade in 1095 at Clermont. His rhetoric about liberating Jerusalem was part of the story \u2014 but only part. There was a social surplus of armed young men who had not inherited land, a plea for help from Byzantium against the Seljuks, and the economic interests of Italian city-states wanting direct access to Levantine trade routes.</p>\n<p>When Crusader forces finally captured Jerusalem on 15 July 1099, they massacred nearly the entire population of the city \u2014 Muslims, Jews, even local Christians deemed insufficiently pure allies. Eyewitness accounts report blood flowing ankle-deep to horses around the Dome of the Rock. This atrocity was not a deviation from the holy mission \u2014 for many Crusade participants, it was considered part of the promised cleansing. Over the following two centuries, nine major waves of Crusades would follow, most ending in military failure, but leaving a trail of cultural exchange far deeper than the participants themselves ever acknowledged.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Contrast with the 1099 Massacre</div><div class=\"persona-name\">Salahuddin al-Ayyubi (Saladin)</div><div class=\"persona-dates\">1137\u20131193 AD \u00b7 Founder of the Ayyubid Dynasty</div><div class=\"persona-body\">Recaptured Jerusalem in 1187 AD \u2014 and did what the Crusaders had not done when they seized the city in 1099: no massacre. Every Christian could purchase their freedom. Those who could not pay were freed by Saladin from his own pocket. Even his enemies admired his character. This contrast was deeply conscious to both sides.</div><div class=\"persona-quote\">\"There will be no killing. No looting. Every Christian may purchase their freedom. I will not do to the Muslims what they did when this city fell to them.\" \u2014 Saladin, 1187 AD</div></div>\n<div class=\"witness\"><div class=\"witness-label\">Eyewitness Record \u2014 Coexistence Behind the Rhetoric of War</div><div class=\"witness-name\">Ibn Jubayr \u2014 Rihla, 1185 AD</div><div class=\"witness-route\">Granada \u2192 Mecca (pilgrimage) \u2192 Baghdad \u2192 Crusader-ruled Jerusalem \u2192 Sicily, 1183\u20131185 AD</div><div class=\"witness-body\">An Andalusian court secretary who performed the hajj and recorded his return through Crusader-held Levant. What surprised him was not hostility, but how smoothly trade and travel continued across a front officially still at war \u2014 Muslim caravans crossed Christian territory safely, paying agreed tolls, even as both sides publicly called for holy war against each other.</div><div class=\"witness-quote\">Ibn Jubayr wrote, almost in disbelief, that \"caravans travel from Egypt to Damascus through Frankish territory without interference,\" even as the same kings and sultans remained at war on other fronts.</div></div>\n<p>Saladin's contrast with the 1099 massacre was so stark that even medieval Christian chroniclers acknowledged it openly. But Saladin's victory did not end the conflict. The Third Crusade that followed, led by Richard the Lionheart of England, failed to retake Jerusalem but succeeded in negotiating Christian pilgrim access to the holy city \u2014 a compromise that, in its own way, acknowledged both sides benefited more from trade and access than from total conquest.</p>\n<div class=\"commodity\"><div class=\"commodity-label\">Commodity and War</div><div class=\"commodity-title\">Spice \u2014 How the Crusades Created a Longing That Drove the Age of Exploration</div><div class=\"commodity-body\">European knights returning from the Levant brought new tastes: spices from the Islamic world \u2014 pepper, cloves, cinnamon, nutmeg. Direct contact with Levantine markets changed aristocratic living standards and created demand that could no longer be met without depending on increasingly expensive Arab and Venetian intermediaries. The longing for spice that emerged from the Crusades was one of the fuels driving the search for a direct sea route to Asia three centuries later. One sack of nutmeg from Banda Neira was worth a house in Amsterdam.</div><div class=\"commodity-quote\">\"Along all this coast the air is fragrant with spices... Pepper grows like vines in our gardens.\" \u2014 Ibn Battuta, Rihla, 14th century</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Unplanned Legacy</div><div class=\"tb-title\">The Knights Templar and the Birth of Modern Banking</div></div><div class=\"tb-body\">The Knights Templar faced a real logistical problem: how could pilgrims carry money on journeys of thousands of kilometers filled with bandits? Solution: a letter of credit system \u2014 deposit money in London, cash it in Acre or Jerusalem. No physical money moved. Only information. When King Philip IV of France \u2014 deeply in debt \u2014 decided it was easier to accuse the Templars of heresy than to repay what he owed, the system had already been absorbed by Italian banking families: the Medici, Bardi, Peruzzi.</div><div class=\"tb-arrow\"><strong>\u2192 From spiritual longing came economic innovation:</strong> The Templar credit system was the prototype of the check, the wire transfer, and the entire architecture of modern finance. The Florentine Renaissance funded by the Medici was an indirect product of the need of Christian pilgrims to safely carry money to the Holy Land.</div></div>\n<p>Knowledge exchange through Crusader contact was not the only channel \u2014 Sicily and Spain, reconquered from Muslim rule, also became major centers of translation, often more systematic than what happened on the Levantine front lines. But the Crusades provided something the other channels lacked: direct, sustained contact between European knights, merchants, and scholars and an Islamic civilization that was, at the time, far more advanced in medicine, mathematics, and philosophy.</p>\n<div class=\"phil\"><div class=\"phil-label\">Relevant Thinker</div><div class=\"phil-name\">Thomas Aquinas (1225\u20131274 AD) \u2014 Summa Theologica</div><div class=\"phil-quote\">\"For a war to be just, three things are necessary: public authority of the sovereign, a just cause, and rightful intention on the part of the combatants.\"</div><div class=\"phil-src\">Aquinas's Just War Theory was born partly in response to the reality of the Crusades. Aquinas was heavily influenced by Ibn Rushd (Averroes), whose works reached Europe through Crusade-era contact \u2014 a deeply ironic circle of influence.</div></div>\n<p>The Crusades failed militarily in the long run \u2014 in 1291, the last Christian stronghold in the Levant, Acre, fell, and the project of reclaiming the Holy Land effectively ended. But this military failure concealed something that succeeded remarkably well: two centuries of forced contact between Europe and the Islamic world left Europe with a credit system, a taste for spice, and access to Greco-Arabic philosophy that would all become fuel for the Renaissance and the Age of Exploration. The next chapter will show that cross-civilizational contact was not the only force shaping history in this period \u2014 there was another force, far smaller and far deadlier, that would transform Europe and Asia more radically than any war or trade ever could.</p>", "b10": "<p class=\"dropcap\">There is a law in history too painful to state openly: plague \u2014 the purest form of disaster without human agenda \u2014 has repeatedly become the catalyst for social, economic, and intellectual changes that could never have occurred any other way. Plague does not choose. And perhaps that is why it has always been the most democratic of renewers.</p>\n<p>The two greatest plagues in this chapter were caused by the same bacterium: Yersinia pestis, which naturally lives in fleas that hitch rides on rats. When a region's rat population collapses from infection, starving fleas move to the nearest available host \u2014 often humans. This same biological mechanism would occur twice in the history we trace in this book, eight centuries apart, and each time, it found a human trade network wide enough to carry it across continents within months, not centuries.</p>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Great Plague I</div><div class=\"tb-title\">The Plague of Justinian, 541\u2013750 AD \u2014 The Beginning of the End of the Ancient World</div></div><div class=\"tb-body\">Procopius of Caesarea recorded that at its peak, Constantinople lost 10,000 souls per day. Emperor Justinian himself was infected and survived, but his ambition to retake Western Rome never recovered. Estimated 25\u201350 million deaths \u2014 about 13\u201326% of the world's population at the time.</div><div class=\"tb-arrow\"><strong>\u2192</strong> The Plague of Justinian weakened Byzantium and Sassanid Persia simultaneously \u2014 just as fresh Arab-Islamic forces untouched by plague emerged from the desert. William McNeill in Plagues and Peoples (1976) argues the seemingly \"miraculous\" Arab conquest only makes sense when we account for this demographic-plague context.</div></div>\n<p>Between the Plague of Justinian and the Black Death stretched nearly eight centuries relatively free of continent-scale plague \u2014 not because Yersinia pestis disappeared, but because a trade network wide enough to spread it that fast had not yet re-formed. What changed matters in the 14th century was exactly what we traced in the previous chapter: Pax Mongolica united Asia in a trade network unlike anything before it. The same route that carried silk, spice, and Rabban Sauma to Paris also carried the fleas bearing bacteria from the Central Asian steppe to Crimean ports, then across all of Europe.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Writing from Within the Disaster</div><div class=\"persona-name\">Giovanni Boccaccio</div><div class=\"persona-dates\">1313\u20131375 AD \u00b7 Florence</div><div class=\"persona-body\">Witnessed Florence losing 60% of its population to the Black Death. His response: the Decameron \u2014 ten young people who flee to a villa and tell stories. Not religious stories. Stories about cleverness, love, and cynicism toward authority. The first European literature to explicitly place humans \u2014 not God \u2014 at the center of the narrative.</div><div class=\"persona-quote\">\"In Florence... many fine houses, once thronged with retainers, were bereft of all their inhabitants down to the meanest servant... nothing was to be heard but sighs and wailing.\" \u2014 Decameron, Prologue, 1353 AD</div></div>\n<div class=\"witness\"><div class=\"witness-label\">Eyewitness Record \u2014 Written While Awaiting Death</div><div class=\"witness-name\">Ibn al-Wardi \u2014 Risalat al-Naba' 'an al-Waba', 1348 AD</div><div class=\"witness-route\">Aleppo, Syria, as the Black Death arrived from the east</div><div class=\"witness-body\">A historian and geographer of Aleppo who wrote his treatise on the plague's origin and spread while watching the city itself collapse around him \u2014 and who died of the same plague shortly after finishing his account. His record traces the plague moving from a \"land of darkness\" in the east \u2014 likely the Central Asian steppe \u2014 through Crimea, then Constantinople, Cairo, and finally Aleppo, proving the Black Death devastating Europe and the plague devastating the Islamic world were one and the same event, not two separate disasters.</div><div class=\"witness-quote\">\"This plague is like a wave of the sea that cannot be held back... I pray to God that I might die a martyr, not die in fear.\" \u2014 Ibn al-Wardi, written shortly before his own death from the plague, 1348 AD</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Great Plague II \u2014 The One That Changed Europe Forever</div><div class=\"tb-title\">The Black Death, 1347\u20131353 AD \u2014 Killer of Feudalism</div></div><div class=\"tb-body\">Genoese ships arrived at Messina, Sicily in October 1347 with crew members dying, their bodies covered in black suppurating boils. Plague swept through Europe in six years. Death toll: 30\u201360% of Europe's population. Some cities lost two-thirds of their inhabitants.</div><div class=\"tb-arrow\"><strong>\u2192 Four structural changes:</strong> (1) Extreme labor scarcity forced feudal landlords to pay higher wages \u2014 feudalism collapsed from below. (2) The Church, whose prayers did not stop the plague, lost moral authority \u2014 seeds of the Protestant Reformation sown 160 years before Luther. (3) Wealth concentrated in surviving merchant class \u2014 funding the Italian Renaissance. (4) The need to explain disease without theology drove observational science. Barbara Tuchman called it \"the most calamitous and simultaneously most fertile century\" in European history.</div></div>\n<p>Not every response to the Black Death was constructive. When medical explanations failed, parts of European society searched for scapegoats \u2014 Jewish communities in many German and French cities were accused of poisoning wells, and became victims of mass massacres even though they were dying from the plague at the same rate as everyone else. The flagellant movement \u2014 groups of pilgrims who whipped themselves in the streets as collective penance \u2014 spread across Europe, sometimes triggering further violence instead of calming public fear. The history of plague is not only a history of renewal; it is also a history of how collective fear can turn into violence against the most vulnerable.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Theory Born from Disaster</div><div class=\"persona-name\">Ibn Khaldun</div><div class=\"persona-dates\">1332\u20131406 AD \u00b7 Tunis, Egypt</div><div class=\"persona-body\">Lost both his parents to the Black Death. That traumatic experience may have inspired the most brilliant part of his Muqaddimah: the theory of asabiyyah (social solidarity) that rises and falls, and how plague destroys asabiyyah in ways that war alone cannot. Ibn Khaldun was the first sociologist to analyze plague as a systematic historical force.</div><div class=\"persona-quote\">\"Civilization both in the East and the West was visited by a destructive plague... Kingdoms became weak, cities and settlements were abandoned, roads and sign-posts were obliterated.\" \u2014 Muqaddimah, after the Black Death</div></div>\n<p>The two plagues framing this chapter \u2014 one at the beginning, one near the end of the era we trace in Volume I \u2014 show a pattern that will keep resurfacing throughout this book: a biological disaster that truly does not choose its victims by religion, class, or nationality, yet whose consequences are always processed through deeply human systems of meaning \u2014 sometimes producing solidarity and renewal, sometimes producing violence and suspicion. The closing chapter of Volume I will show how a single event \u2014 the fall of a city on the shore of the Bosporus \u2014 will draw together nearly every thread we have traced: trade, religion, plague, and a longing never truly satisfied, into one turning point that opens the modern world.</p>", "closing": "<p class=\"dropcap\">On 29 May 1453, Ottoman forces under Mehmed II entered Constantinople through a breach made by a massive cannon designed by Urban \u2014 a Hungarian engineer who had previously come to offer his services to Emperor Constantine XI, was refused for lack of funds, and then went to the side that could pay.</p>\n<p>The siege lasted 53 days. Constantinople, which for over a thousand years had never been breached by any enemy thanks to its triple-layered Theodosian Walls, finally fell not from a failure of defensive strategy, but from technology that rendered any ancient wall obsolete. Urban's Basilica cannon \u2014 over eight meters long, requiring sixty oxen to haul \u2014 could fire a stone ball weighing more than 500 kilograms. This was not merely the defeat of one city. It was the moment a thousand years of fortress-defense technology became obsolete within weeks.</p>\n<p>Emperor Constantine XI fell in battle. His body was never found with certainty. The empire that claimed direct continuity from Augustus, that survived a thousand years after Western Rome fell \u2014 ended in a single day.</p>\n<p>Mehmed II, aged 21, entered the city on horseback toward the Hagia Sophia. He did not destroy the city. He moved his capital there. He invited the Greek Orthodox Patriarch to remain and serve his congregation with state protection. He called himself Kayser-i Rum \u2014 Emperor of Rome. Mehmed was not merely conquering. He was claiming an inheritance.</p>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">One Door Closes, Two Open</div><div class=\"tb-title\">1453 as the Greatest Bifurcation Point in Modern History</div></div><div class=\"tb-body\">In Western Europe, news of Constantinople's fall felt like a small apocalypse. The overland route to Asia was increasingly closed. And from that panic arose two things that nobody could predict.</div><div class=\"tb-arrow\"><strong>First Door:</strong> Byzantine scholars who fled to Italy brought manuscripts \u2014 Plato, Aristotle, Plotinus \u2014 unknown in Western Europe for centuries. In Florence, Cosimo de' Medici founded a Platonic Academy for them. From there, within two generations, the Renaissance was born.<br/><br/><strong>Second Door:</strong> With the overland route to Asia increasingly inaccessible, Portugal and Spain were forced to seek sea routes. Columbus sailed 39 years after 1453. Vasco da Gama rounded Africa 45 years later. All of global maritime capitalism and our world today can be traced to one moment: Urban's cannon breaching the walls of Constantinople.</div></div>\n<p>If we draw a straight line from the pillars of G\u00f6bekli Tepe that opened this volume to Urban's cannon that closes it, that eleven-thousand-year distance tells one continuous story: humans who never stopped searching for ways to organize their lack \u2014 through ritual, through god-states, through philosophy, through religion, through trade, through conquest. Every solution created a new problem. Every answer gave birth to the next question. 1453 was not the end of that search \u2014 it was only the close of one chapter, before the next begins with the same question, in an entirely different form.</p>\n<p><em>One door closed. Two opened. And from those two doors flowed all the history we will read in Volume II.</em></p>"};
const SECTION_IDS = ["cover", "epigraph", "int0", "b1", "b2", "b3", "b4", "b5", "int1", "b6", "b7", "int2", "b8", "b9", "b10", "closing"];
const BODY_MAP = {"int0-body": "int0", "b1-body": "b1", "b2-body": "b2", "b3-body": "b3", "b4-body": "b4", "b5-body": "b5", "int1-body": "int1", "b6-body": "b6", "b7-body": "b7", "int2-body": "int2", "b8-body": "b8", "b9-body": "b9", "b10-body": "b10", "cl-body": "closing"};
const FIELDS = ["vol-label", "cover-title", "cover-sub", "cover-vol2", "cover-byline", "scroll", "epi1", "epi1s", "epi2", "epi2s", "toc-hdr", "int0-mark", "int0-title", "int0-sub", "b1-mark", "b1-title", "b1-sub", "b2-mark", "b2-title", "b2-sub", "b3-mark", "b3-title", "b3-sub", "b4-mark", "b4-title", "b4-sub", "b5-mark", "b5-title", "b5-sub", "int1-mark", "int1-title", "int1-sub", "b6-mark", "b6-title", "b6-sub", "b7-mark", "b7-title", "b7-sub", "int2-mark", "int2-title", "int2-sub", "b8-mark", "b8-title", "b8-sub", "b9-mark", "b9-title", "b9-sub", "b10-mark", "b10-title", "b10-sub", "cl-mark", "cl-title", "cl-sub", "trans-text", "trans-link", "refs-hdr", "col-title", "col-sub", "col-note"];
const TITLE_ID = "Jejak yang Tidak Pernah Bersih \u2014 Jilid I: Akar";
const TITLE_EN = "The Trail That Was Never Clean \u2014 Volume I: Roots";

let currentLang = 'id';

function setLang(lang) {
  currentLang = lang;
  const L = T[lang];
  const BODIES = lang === 'id' ? BODIES_ID : BODIES_EN;

  document.getElementById('btn-id').classList.toggle('active', lang === 'id');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.title = lang === 'id' ? TITLE_ID : TITLE_EN;

  FIELDS.forEach(k => {
    const el = document.getElementById('t-' + k);
    if (el && L[k] !== undefined) el.textContent = L[k];
  });

  const tocBody = document.getElementById('toc-body');
  if (tocBody) {
    tocBody.innerHTML = L.toc.map(item =>
      `<li><a href="#${item[0]}"><span class="toc-num">${item[1]}</span><span class="toc-ti">${item[2]}</span></a></li>`
    ).join('');
  }
  const tocPanelList = document.getElementById('toc-panel-list');
  if (tocPanelList) {
    tocPanelList.innerHTML = L.toc.map(item =>
      `<a href="#${item[0]}">${item[1]} — ${item[2]}</a>`
    ).join('');
  }

  Object.entries(BODY_MAP).forEach(([elId, bodiesKey]) => {
    const el = document.getElementById(elId);
    if (el && BODIES[bodiesKey] !== undefined) el.innerHTML = BODIES[bodiesKey];
  });

  const refsEl = document.getElementById('refs-body');
  if (refsEl) {
    refsEl.innerHTML = L.refs.map(r => `<li><em>${r[0]}</em> — ${r[1]}</li>`).join('');
  }

  const coverVolLink = document.getElementById('t-cover-vollink');
  if (coverVolLink) coverVolLink.textContent = L['trans-link'];

  reattachTocPanelClose();
}

function reattachTocPanelClose(){
  const tocPanel = document.getElementById('toc-panel');
  const tocBtn = document.getElementById('toc-toggle');
  document.querySelectorAll('#toc-panel a').forEach(a => {
    a.addEventListener('click', () => {
      tocPanel.classList.remove('open');
      tocBtn.setAttribute('aria-expanded', 'false');
      revealAll();
    });
  });
  document.querySelectorAll('.toc-list a').forEach(a => {
    a.addEventListener('click', () => setTimeout(revealAll, 50));
  });
}

function revealAll(){
  document.querySelectorAll('.chapter, .interlude').forEach(c => c.classList.add('visible'));
}

// ===== render content first, before any animation/observer code runs =====
setLang('id');

// ===== progressive enhancement below — wrapped defensively so a failure =====
// ===== here can never prevent the content above from being visible =====
try {
  const bar = document.getElementById('progress');
  function updateProgress(){
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = (isFinite(scrolled) ? scrolled : 0) + '%';
  }
  document.addEventListener('scroll', updateProgress, {passive:true});
  updateProgress();
} catch(e) {}

try {
  const tocBtn = document.getElementById('toc-toggle');
  const tocPanel = document.getElementById('toc-panel');
  tocBtn.addEventListener('click', () => {
    const open = tocPanel.classList.toggle('open');
    tocBtn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', (e) => {
    if (!tocPanel.contains(e.target) && !tocBtn.contains(e.target)) {
      tocPanel.classList.remove('open');
      tocBtn.setAttribute('aria-expanded', 'false');
    }
  });
} catch(e) {}

try {
  const sections = document.querySelectorAll('.chapter, .interlude');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, {threshold: 0.01, rootMargin: '0px 0px -20px 0px'});
    sections.forEach(c => io.observe(c));
  } else {
    revealAll();
  }
} catch(e) { revealAll(); }
window.addEventListener('load', () => setTimeout(revealAll, 1200));

try {
  const dots = document.querySelectorAll('.tld');
  const dotObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = SECTION_IDS.indexOf(e.target.id);
        if (i > -1) {
          dots.forEach(dd => dd.classList.remove('on'));
          if (dots[i]) dots[i].classList.add('on');
        }
      }
    });
  }, { threshold: 0.18 });
  SECTION_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) dotObs.observe(el);
  });
  dots.forEach((d, i) => {
    d.addEventListener('click', () => {
      const el = document.getElementById(SECTION_IDS[i]);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
  });
} catch(e) {}

</script>

</body>
</html>
