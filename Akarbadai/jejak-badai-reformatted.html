III: \"We possess all things. I set no value on objects strange or ingenious, and have no use for your country's manufactures.\" The East India Company found a cold solution: export Bengali opium to China on a massive scale, creating an addictive market that previously did not exist. Within decades, millions of Chinese people became addicted, and China's gold began flowing out to pay for opium. When Commissioner Lin Zexu seized and destroyed 1,200 tons of British opium in Canton in 1839, Britain declared war. The Opium Wars (1839\u20131842) are perhaps the clearest example in history of state military power used explicitly to defend the right to sell narcotics.</div><div class=\"commodity-quote\">\"We find that your country is sixty or seventy thousand li from China. Yet there are barbarian ships that strive to come here for trade for the purpose of making a great profit... We have heard that in your own country opium is prohibited with the utmost strictness and severity.\" \u2014 Lin Zexu, letter to Queen Victoria, 1839</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The Bureaucrat Who Was Right and Lost</div><div class=\"persona-name\">Lin Zexu</div><div class=\"persona-dates\">1785\u20131850 AD \u00b7 Imperial Commissioner, Canton</div><div class=\"persona-body\">A highly talented, honest Confucian bureaucrat who genuinely believed he was doing the right thing. Led the destruction of 1,200 tons of British-owned opium, wrote a letter to Queen Victoria using moral logic that could not be rationally refuted \u2014 and was sent into exile by Emperor Daoguang after Britain responded with military force. Lin Zexu is the perfect moral tragedy: someone who was morally right and completely defeated because what he faced was a force that did not care about morality.</div><div class=\"persona-quote\">\"We destroy this opium not only to protect the people of China \u2014 but to protect all of humanity from this poison.\" \u2014 Lin Zexu, while overseeing the opium destruction, 1839</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Warned from Within Marxism</div><div class=\"persona-name\">Rosa Luxemburg</div><div class=\"persona-dates\">1871\u20131919 AD \u00b7 Zamosc, Poland</div><div class=\"persona-body\">Criticized Lenin from within the Marxist tradition, warning that revolution carried out by an elite vanguard in the name of the people would end with a dictator in the name of the proletariat. Murdered by right-wing paramilitaries in Berlin in 1919, her body thrown into a canal. Her warning about the dangers of power centralization in revolutionary movements proved prophetic \u2014 but no one was listening because she was dead before Stalinism fully materialized.</div><div class=\"persona-quote\">\"Freedom only for the supporters of the government, only for the members of one party \u2014 is no freedom at all. Freedom is always the freedom of the one who thinks differently.\" \u2014 Rosa Luxemburg, 1918</div></div>\n<div class=\"phil\"><div class=\"phil-label\">Relevant Thinker</div><div class=\"phil-name\">Eric Hoffer (1902\u20131983) \u2014 The True Believer, 1951</div><div class=\"phil-quote\">\"Mass movements can rise and spread without belief in a god, but never without belief in a devil.\"</div><div class=\"phil-src\">Hoffer analyzed why mass movements \u2014 religious, revolutionary, nationalist \u2014 always need a clear enemy. This is not a bug of any particular ideology; it is a feature of how the human mind builds group solidarity.</div></div>", "b15": "<p class=\"dropcap\">28 June 1914. Gavrilo Princip shot Archduke Franz Ferdinand in Sarajevo. From one assassination to the mobilization of tens of millions of soldiers from Britain to Japan: six weeks. Not because everyone wanted war \u2014 almost no one did. But because the alliance system designed to prevent war became an automatic escalation machine that could not be stopped once set in motion.</p>\n<p>But calling this merely a \"European War\" is a mistake this book has been building against since Chapters XI and XII. Two powers we have traced for three centuries as peripheral players \u2014 Japan, forced open by Perry's Black Ships, and America, only declaring itself a colonial power in 1898 \u2014 were no longer spectators. They brought their own logic and their own wounds into both wars, and both wars, in turn, changed them permanently.</p>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">From Tsushima to Nanking, 1905\u20131937</div></div><div class=\"tb-body\">Half a century after Commodore Perry forced Japan open, the lightning modernization of the Meiji era produced something that stunned the world: in 1905, the Japanese fleet destroyed the Russian fleet at the Strait of Tsushima \u2014 the first Asian power to defeat a European power in modern war. The news electrified every anti-colonial movement from Vietnam to India. But that same confidence, over the following three decades, mutated into something far darker: the invasion of Manchuria in 1931, then the Nanking Massacre of 1937 \u2014 hundreds of thousands of civilians killed within weeks by forces that had once been a symbol of Asian anti-colonial hope.</div><div class=\"tb-arrow\"><strong>\u2192 The geopolitical version of the Iron Law:</strong> A movement born from authentic longing not to be colonized \u2014 Meiji modernization as a direct response to the trauma of being \"forced open\" by Perry \u2014 once successful and empowered, reproduced exactly what it had originally opposed: the conquest and subjugation of other peoples. The Pacific Theater of World War II is not an appendix to the European war. It is a parallel story with its own roots, beginning in Chapter XII, long before Sarajevo.</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The Poet Who Died One Week Before Peace</div><div class=\"persona-name\">Wilfred Owen</div><div class=\"persona-dates\">1893\u20131918 AD \u00b7 Oswestry, England</div><div class=\"persona-body\">Wrote the most powerful anti-war poems ever produced from within the trenches of World War I. Killed on 4 November 1918 \u2014 seven days before the armistice. His mother received the telegram of his death just as the church bells began ringing to celebrate peace. His poem Dulce et Decorum Est \u2014 mocking the claim that dying for one's country is sweet and noble \u2014 is one of the most important anti-war texts in literary history.</div><div class=\"persona-quote\">\"If in some smothering dreams you too could pace / Behind the wagon that we flung him in... / My friend, you would not tell with such high zest / To children ardent for some desperate glory, / The old Lie: Dulce et decorum est / Pro patria mori.\" \u2014 Wilfred Owen, 1917</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">The Holocaust \u2014 When Modernity and Bureaucracy Served Absolute Evil</div></div><div class=\"tb-body\">The Holocaust is a moment when we must acknowledge something very dark about modernity: that the ability to organize, administer, and execute efficiently \u2014 which we usually consider positive attributes of civilization \u2014 can be used for the most inhumane purposes. Six million European Jews were killed using modern industrial methods: train schedules, administrative lists, and the division of labor that divided responsibility so that no single person felt fully responsible.</div><div class=\"tb-arrow\"><strong>\u2192 Hannah Arendt, Eichmann in Jerusalem (1963):</strong> Adolf Eichmann \u2014 the logistics administrator of deportations \u2014 was not a monster consciously committing great evil. He was a very ordinary bureaucrat, doing his job efficiently, who never really thought about the moral meaning of what he was doing. <em>The banality of evil</em> \u2014 evil committed not by monsters but by ordinary people who stopped thinking. This is the most important moral insight of the 20th century.</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Chose to Speak When Everyone Was Silent</div><div class=\"persona-name\">Sophie Scholl</div><div class=\"persona-dates\">1921\u20131943 AD \u00b7 Forchtenberg, Germany</div><div class=\"persona-body\">A university student who together with her brother Hans distributed anti-Nazi leaflets in Munich through the White Rose movement. Arrested, tried in a four-day show trial, and executed at age 21. Her last words before execution: \"The sun still shines.\" She is a symbol that even in a system demanding total obedience, there is room to choose \u2014 and that choice can be made by very ordinary humans with extraordinary courage.</div><div class=\"persona-quote\">\"The sun still shines.\" \u2014 Sophie Scholl's last words before execution, 22 February 1943</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">Dragged Out of Isolation Twice, 1917 &amp; 1941</div></div><div class=\"tb-body\">America, already a colonial power since the Spanish-American War of 1898, surprisingly spent the following two decades trying to avoid involvement in the very world stage it had just entered. Woodrow Wilson was re-elected in 1916 on the slogan \"he kept us out of war.\" Only after the Lusitania was sunk and the Zimmermann Telegram was exposed \u2014 Germany offering U.S. territory to Mexico in exchange for an alliance \u2014 did America finally enter the war in 1917. An almost identical pattern repeated two decades later: strong isolationist sentiment throughout the 1930s, Congress passing a series of Neutrality Acts, until the attack on Pearl Harbor on 7 December 1941 ended the debate in a single morning.</div><div class=\"tb-arrow\"><strong>\u2192 Not an ideological choice, but a recurring reaction:</strong> Twice within a quarter century, a power already a global player since 1898 tried to withdraw back into its own continental shell \u2014 and twice was dragged out not by conviction but by direct attack. America did not choose to become a global superpower through a planned vision; it was dragged there, twice, with genuine reluctance on both occasions.</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">From the Ashes of War, the Modern World Was Born</div><div class=\"tb-title\">The Technological and Moral Legacy of Two World Wars</div></div><div class=\"tb-body\">85 million deaths. But from that horror: Alan Turing cracked Enigma and laid the foundation for modern computing. Industrial antibiotics were developed for WWII military needs. Nuclear energy from the Manhattan Project. The UN, Universal Declaration of Human Rights 1948, Geneva Conventions \u2014 an international order born from the determination that this must never happen again.</div><div class=\"tb-arrow\"><strong>\u2192 The unavoidable paradox:</strong> Every great advance born from war leaves a question that cannot be satisfactorily answered: does this progress justify the suffering that produced it? The computer we use today is the grandchild of Turing's machine. Turing's machine was born to win a war that killed 85 million people. We cannot separate that inheritance from the tools we hold.</div></div>\n<div class=\"pull\">World War II was the first war that was truly global \u2014 no longer a European war with colonies dragged along, but three centers of gravity already independent since Chapters XI through XIII \u2014 Europe, America, Asia-Pacific \u2014 now colliding at once, each carrying its own wound into a shared one.</div>", "int4": "<p class=\"dropcap\">Behind all the chaos, contradiction, and regression we have documented, there is one thing that does seem to progress, however non-linearly: <em>the expanding moral circle</em> \u2014 who counts as \"us,\" who deserves to be treated with dignity.</p>\n<p>Ancient humans only had moral obligations toward members of their immediate group. The Axial Age expanded the circle beyond tribe and caste. Universal religious movements expanded it to all believers. The Enlightenment expanded it to all humans as humans. The civil rights movement expanded it to groups previously explicitly excluded. Animal rights and environmental ethics are beginning to expand it beyond the boundary of the human species.</p>\n<div class=\"pull\">This is not smooth progress. At the same time the Stoic Romans taught the equality of all humans, Rome had millions of slaves. At the same time the Enlightenment declared all men equal, they ran trans-Atlantic slavery. But this contradiction is the source of progress \u2014 because declared principles create standards that the oppressed can use to demand consistency.</div>\n<p>Frederick Douglass used the American Declaration of Independence to demand the abolition of slavery. Gandhi used Christian principles and British law against the British Empire. Moral progress works through the tension between announced principles and practiced reality.</p>", "b16": "<p class=\"dropcap\">In 1947, when India gained independence after 200 years of British colonialism, a country that around 1700 had produced approximately 25% of global GDP \u2014 with a highly sophisticated textile industry \u2014 now contributed only about 4%. This was not because India \"failed to develop.\" It was because India's textile industry was actively destroyed by colonial policies forcing India to import British textiles and export raw cotton.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Calculated How Much Was Stolen</div><div class=\"persona-name\">Dadabhai Naoroji</div><div class=\"persona-dates\">1825\u20131917 AD \u00b7 Mumbai, India</div><div class=\"persona-body\">The first Indian economist and politician to calculate quantitatively how much wealth Britain \"drained\" from India \u2014 in Poverty and Un-British Rule in India (1901). His theory of the \"drain of wealth\" showed that India's poverty was not a product of internal Indian conditions but a systematic product of colonial extraction. He was the first person from Asia elected as a member of the British Parliament \u2014 using the colonial legal system to critique colonialism from within.</div><div class=\"persona-quote\">\"Britain drains India... What Britain gives is law and order, but law and order used to drain it itself.\" \u2014 Dadabhai Naoroji, 1901</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">The Sykes-Picot Agreement 1916 \u2014 When a Pencil Line Became a Bomb</div></div><div class=\"tb-body\">British diplomat Mark Sykes and French diplomat Fran\u00e7ois Georges-Picot divided the Arab Middle East into spheres of influence with lines drawn on a map without regard for the ethnic, tribal, or religious identities of the communities living there. Kurds were divided among four countries. Sunni and Shia were mixed into one artificial entity (Iraq). Palestine was promised simultaneously to Arabs and to Jews.</div><div class=\"tb-arrow\"><strong>\u2192 A time bomb still exploding:</strong> Almost all major conflicts in the Middle East today can be traced to decisions made by two European diplomats in one 1916 meeting. Sykes-Picot is the clearest example of how decisions made based on short-term imperial interests create geopolitical crises lasting centuries.</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">Lines in the Sand Became Kingdoms \u2014 The Arab States and the Discovery of Oil, 1920\u20131938</div></div><div class=\"tb-body\">The Sykes-Picot lines drawn in 1916 began filling with names and thrones. Iraq, Jordan, and other mandate territories were born at the British-French negotiating table, often with imported monarchies with no local roots \u2014 Faisal bin Hussein was installed as King of Iraq by the British just a year after being expelled from Syria by the French. On the Arabian Peninsula, Abdulaziz bin Saud unified tribal territories into the Kingdom of Saudi Arabia in 1932 \u2014 a country that was, at the time, poor, dependent on hajj pilgrimage revenue, and barely counted by anyone.</div><div class=\"tb-arrow\"><strong>\u2192 Then everything changed with one well:</strong> In 1938, Standard Oil of California discovered a massive oil reserve at Dammam, Saudi Arabia. Within one generation, the poorest desert kingdom in the Arab world became the holder of the largest oil reserves on earth. Geology formed millions of years earlier suddenly determined who would hold the next chapter of global power.</div></div>\n<div class=\"commodity\"><div class=\"commodity-label\">Civilizational Commodity</div><div class=\"commodity-title\">The Petrodollar \u2014 Money No Longer Anchored to Gold</div><div class=\"commodity-body\">14 February 1945, aboard the warship USS Quincy in the Suez Canal, President Franklin D. Roosevelt met King Abdulaziz bin Saud. The agreement born from that meeting was simple but reshaped the architecture of the world economy: America guaranteed Saudi Arabia's security, and in return gained privileged access to its oil. When President Nixon detached the dollar from the gold standard in 1971, that old agreement found a new function \u2014 in 1974, Saudi Arabia agreed to sell its oil only in U.S. dollars, then reinvest much of its profits into U.S. government bonds. The dollar, no longer backed by gold, was now backed by something far more volatile: oil, and one desert kingdom's willingness to keep trading it in a particular currency.</div><div class=\"commodity-quote\">\"Who controls the oil controls the nations; who controls the food controls the people; who controls the money controls the entire world.\" \u2014 attributed to Henry Kissinger, during the formation of the petrodollar system</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Point of Transformation</div><div class=\"tb-title\">The Cold War as Two Secular Theologies Fighting Over the Middle East, 1947\u20131989</div></div><div class=\"tb-body\">Once the old empires left, two new systems of meaning \u2014 both claiming to be fully rational and secular \u2014 rushed to fill the same vacuum. American capitalism and Soviet communism were not merely two competing economic systems; they were two secular eschatologies each accusing the other of heresy. The Middle East, with its oil and its geography, became one of the main chessboards: Nasser's Egypt leaned toward Moscow, the Shah's Iran became a close ally of Washington, Iraq shifted alliances as its interests demanded.</div><div class=\"tb-arrow\"><strong>\u2192 An irony this book already knows:</strong> Both ideologies were born from authentic longing \u2014 liberation from colonial exploitation on one side, individual freedom on the other. But once both became state powers fighting over resources on someone else's land, they reproduced exactly the pattern they once opposed: foreign intervention, puppet regimes, and local populations paying the price for a battle that was never theirs.</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Voice of the Marginalized</div><div class=\"persona-name\">Frantz Fanon</div><div class=\"persona-dates\">1925\u20131961 AD \u00b7 Fort-de-France, Martinique</div><div class=\"persona-body\">A psychiatrist from Martinique who joined the Algerian independence struggle and wrote The Wretched of the Earth (1961) \u2014 the most influential decolonization manifesto. His analysis of the psychological trauma of colonialism \u2014 how it not only exploits materially but also destroys the identity and self-confidence of the colonized \u2014 remains highly relevant for understanding identity crises in postcolonial nations.</div><div class=\"persona-quote\">\"Europe is literally the creation of the Third World. The wealth which smothers her is that which was stolen from the under-developed peoples.\" \u2014 Fanon, The Wretched of the Earth, 1961</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Two Collapses, One Vacuum</div><div class=\"tb-title\">1979 and 1991 \u2014 When Both Secular Theologies Lost Their Believers</div></div><div class=\"tb-body\">1979: The Iranian Revolution overthrew the American-backed Shah and established the first Islamic republic of the modern era \u2014 an explicit rejection of both competing secular offers, capitalism and communism, in favor of a third: a return to religious identity as the foundation of the state. That same year, the Soviet invasion of Afghanistan triggered an armed resistance funded and armed by Western states, birthing a network of fighters who would later turn in a different direction. 1991: The Soviet Union collapsed. One of the twentieth century's two great secular theologies lost the state that believed in it. The Gulf War that same year \u2014 triggered by Iraq's invasion of Kuwait \u2014 was the first major post-Cold War conflict openly fought over oil.</div><div class=\"tb-arrow\"><strong>\u2192 A vacuum that never stayed empty:</strong> When communism collapsed and capitalism lost its ideal opponent, it did not automatically win the hearts of those both had failed. In parts of the Muslim world, two secular ideologies that had failed to deliver on their promises \u2014 the promise of prosperity and the promise of justice \u2014 opened space for movements offering the existential and cosmic longing both had long ignored: transnational religious movements that, among a small fraction of followers, took extreme and violent form. This book's iron law applies once again \u2014 a lack unfilled by one meaning system will seek its answer elsewhere, and not always somewhere peaceful.</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">A Legacy That Walked</div><div class=\"tb-title\">The War That Never Stopped Exporting People, 2003\u20132016</div></div><div class=\"tb-body\">The 2003 invasion of Iraq dismantled a state that, however brutal its government, had at least kept institutions standing \u2014 leaving a vacuum filled by years of sectarian civil war. The Arab Spring of 2011 began with democratic hope in Tunisia and Egypt, but in Syria and Libya turned into prolonged civil war. In 2015, more than one million refugees from Syria, Iraq, and Afghanistan crossed into Europe in a single year \u2014 the continent's largest migration crisis since World War II.</div><div class=\"tb-arrow\"><strong>\u2192 A test for the expanding circle:</strong> This crisis became a real test of the expanding moral circle thesis traced throughout this book. Some Europeans opened their doors. Others closed their gates and built new walls. The expansion of the moral circle is never automatic or linear \u2014 it is always contested anew whenever great lack meets equally great fear.</div></div>", "b17": "<div style=\"font-style:italic;color:var(--ink-muted);font-size:0.85em;margin-bottom:1.3em;\">This chapter deliberately jumps backward. Chapter XVI ended in 2016 \u2014 we need to return first to 1918, because the same pattern traced in Chapter X (the Plague of Justinian, then the Black Death eight centuries later) is repeating here across a far shorter span: one century, not eight.</div>\n<p class=\"dropcap\">February 1918. In US military camps preparing troops to be sent to Europe, soldiers began falling ill with strange influenza symptoms: unlike ordinary flu \u2014 it was most deadly for those aged 20\u201340, the group usually most resistant. Within months, the virus was in every corner of the earth. 50\u2013100 million deaths \u2014 surpassing the casualties of the World War I then underway.</p>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Warned and Was Not Heard</div><div class=\"persona-name\">Li Wenliang</div><div class=\"persona-dates\">1986\u20132020 AD \u00b7 Wuhan, China</div><div class=\"persona-body\">An ophthalmologist in Wuhan who in December 2019 warned colleagues about an unusual cluster of pneumonia resembling SARS. Police summoned him and forced him to sign a statement that he had \"made false statements disturbing social order.\" He returned to work, was infected with COVID-19 by a patient, and died on 7 February 2020 \u2014 aged 33. His last words on social media: \"I think a healthy society should not have only one voice.\"</div><div class=\"persona-quote\">\"I think a healthy society should not have only one voice.\" \u2014 Li Wenliang, before his death, February 2020</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">Great Plague IV</div><div class=\"tb-title\">COVID-19, 2019\u20132023 \u2014 Accelerator of a New Order</div></div><div class=\"tb-body\">7 million official deaths; estimated excess mortality approaching 15\u201320 million. The global economy contracted in one quarter at a speed surpassing the Great Depression of 1929. Almost every major city on earth experienced lockdown. The mRNA vaccine was developed in 11 months \u2014 an absolute record proving that with the right urgency and funding, science can move at speeds previously considered impossible.</div><div class=\"tb-arrow\"><strong>\u2192 Four accelerations:</strong> (1) Remote work became the new normal \u2014 permanently reshaping real estate economics and urban demographics. (2) Global AI investment jumped from ~$50 billion (2019) to &gt;$200 billion (2023). (3) Supply chains proven fragile drove re-shoring and selective de-globalization. (4) Questions about global institutional readiness to face crises \u2014 long ignored \u2014 suddenly became very real and very urgent.</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Persisted Through Decades of Obscurity</div><div class=\"persona-name\">Katalin Karik\u00f3</div><div class=\"persona-dates\">1955\u2013 \u00b7 Szolnok, Hungary</div><div class=\"persona-body\">A scientist who spent decades working on mRNA technology in complete obscurity \u2014 demoted by the University of Pennsylvania because her research was considered unpromising, losing grant after grant. Until her technology became the basis for COVID vaccines that saved millions of lives in 11 months. Received the Nobel Prize in Medicine in 2023. Her story is about how the scientific system often punishes research too far ahead of its time \u2014 until a crisis arrives and suddenly everyone needs exactly what was long ignored.</div><div class=\"persona-quote\">\"I never thought about failure. I always thought: what do I need to do next?\" \u2014 Katalin Karik\u00f3, upon receiving the Nobel Prize, 2023</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">The Pandemic's Hidden Legacy</div><div class=\"tb-title\">Two Years That Emptied the World \u2014 A Scale of Social Deficit Never Before Seen</div></div><div class=\"tb-body\">The COVID-19 lockdowns did not merely halt the economy \u2014 they halted nearly every ritual that had bound humans to one another, on a simultaneous scale never before experienced. Weddings were canceled or moved to screens. Funerals were attended over Zoom. Communal worship stopped for months across nearly every major world religion. An entire generation of children lost face-to-face interaction at precisely the age most formative for their social development. And behind all of it, screen time exploded to levels never recorded before \u2014 humans grew accustomed to \"talking\" for hours to a glowing box, long before that box could answer back in a coherent sentence.</div><div class=\"tb-arrow\"><strong>\u2192 Accumulated lack waiting for an answer:</strong> In 2023, the U.S. Surgeon General issued an official advisory naming loneliness a public health crisis equivalent to smoking 15 cigarettes a day. This was not a coincidence standing on its own. It was precisely the condition into which a digital conversational entity \u2014 available 24 hours a day, free of social judgment, free of the risk of rejection \u2014 would land with extraordinary appeal.</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 Who Named the Invisible Crisis</div><div class=\"persona-name\">Vivek Murthy</div><div class=\"persona-dates\">1977\u2013 \u00b7 U.S. Surgeon General</div><div class=\"persona-body\">Published the advisory \"Our Epidemic of Loneliness and Isolation\" in May 2023 \u2014 the first official U.S. government document to explicitly state that loneliness and social isolation constitute a health threat on par with other major public health crises, with an impact equivalent to smoking 15 cigarettes a day. Murthy did not blame the pandemic alone \u2014 he pointed to a trend already rising before 2020, one dramatically accelerated by two years of forced isolation. His advisory became one of the most cited documents as society began trying to understand why acceptance of AI chatbots happened so quickly and so emotionally.</div><div class=\"persona-quote\">\"We have been living in a way that makes us increasingly alone... And that aloneness carries real and urgent health consequences we can no longer afford to ignore.\" \u2014 Vivek Murthy, Our Epidemic of Loneliness and Isolation, May 2023</div></div>\n<div class=\"pull\">Before the machine learned to speak, humans had already forgotten how to speak to one another.</div>", "b18": "<p class=\"dropcap\">There is something strange about the condition of our civilization in 2026. We have computing power greater than all computers that ever existed before the year 2000 combined. We can speak with an entity that summarizes the entire written knowledge corpus of humanity. And we still cannot stop a child from starving in Sudan, still build weapons that can obliterate cities in minutes, still burn fossil fuels while knowing the consequences.</p>\n<p>Chapter I opened this book with four great transformations in how humans organize energy: from Stone to Grain, from Village to City, from Muscle to Machine \u2014 and the fourth, which at the time was still an open question: from Machine to Mind. This chapter is the full answer to that question. Every rung on the ladder toward that answer has a name: the steam engine and railway already traced in Chapter XIII, then computation, then data, and now machine learning capable of absorbing nearly the entire written knowledge of humanity and returning it within seconds.</p>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">The Final Rung</div><div class=\"tb-title\">From ENIAC to the iPhone \u2014 Six Decades of Computational Compression, 1945\u20132007</div></div><div class=\"tb-body\">ENIAC, the first general-purpose electronic computer, was completed in 1945 \u2014 weighing 27 tons, filling an entire room, calculating no faster than today's pocket calculator. Two decades later, integrated circuits compressed thousands of vacuum tubes onto a single silicon chip. ARPANET in 1969 connected the first computers into one network \u2014 the seed of the internet. The World Wide Web in 1991 opened that network to the public. The iPhone in 2007 moved all of that capability into everyone's pocket. And behind it, largely unnoticed, grew something quieter still: data centers storing and processing volumes of information the ENIAC generation could never have imagined.</div><div class=\"tb-arrow\"><strong>\u2192 A ladder leading to one point:</strong> Transportation (Chapters XI, XIII) compressed distance. Information (the telegraph cable, Chapter XIII) compressed the time it took a message to travel. Computation compressed calculation itself. And the convergence of all three \u2014 a global network, cheap computing power, and massive volumes of data \u2014 are the three technical preconditions that made generative AI possible in exactly 2022, no sooner, no later.</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">The Coincidence That Changed Everything</div><div class=\"tb-title\">A Historical Accident \u2014 November 2022</div></div><div class=\"tb-body\">ChatGPT was released by OpenAI on 30 November 2022 not as a product engineered to explode in popularity \u2014 it was originally billed as merely a \"low-key research preview,\" a way to gather feedback before a larger launch. What happened next was the fastest consumer product adoption in human history: one hundred million users within two months, a speed never reached by television, the internet, or even social media before it.</div><div class=\"tb-arrow\"><strong>\u2192 Timing that was no coincidence:</strong> The launch landed exactly 32 months after the first lockdowns \u2014 precisely when the world's population was most accustomed to interacting through text with an entity on a screen, most lonely according to official data, and most open to conversation available anytime without risk of social judgment. The adoption speed that looked like a technological miracle in fact makes little sense without accounting for the two years of social emptiness that preceded it. This is not proof that artificial intelligence was destined for something greater. It is this book's old pattern repeating once more: disaster destroys resistance that could never be overcome under normal conditions, creating a vacuum \u2014 and something always rushes to fill it faster than anyone could have planned.</div></div>\n<div class=\"commodity\"><div class=\"commodity-label\">Civilizational Commodity</div><div class=\"commodity-title\">Digital Coffee \u2014 When the Conversation Space Became an Isolation Space</div><div class=\"commodity-body\">Ottoman and 17th-century London coffeehouses were spaces where people came without specific purpose, sat for hours, and spoke with strangers. From there emerged Lloyd's of London, the London Stock Exchange, and independent journalism. Starbucks, founded in Seattle in 1971 and expanded to 35,000 outlets in 80 countries, revives the coffeehouse format as a social space \u2014 but in a way that fundamentally changes its character. The 21st-century coffeehouse is where people come with laptops, wear headphones, and avoid eye contact. The social format that gave birth to the Enlightenment has become a format for productive isolation. Social media promises unlimited connection \u2014 and produces loneliness unprecedented at this scale.</div><div class=\"commodity-quote\">\"The first coffeehouse created a public space where ideas could compete freely. The 21st-century coffeehouse creates a private space in the midst of a public crowd.\" \u2014 Ray Oldenburg, The Great Good Place, 1989</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The Father of Computing Betrayed by His Country</div><div class=\"persona-name\">Alan Turing</div><div class=\"persona-dates\">1912\u20131954 AD \u00b7 London, England</div><div class=\"persona-body\">Cracked the Nazi Enigma code at Bletchley Park and in the process laid the foundation of modern computing theory. After the war, criminalized by the state he helped save for his sexual orientation. Subjected to chemical castration as \"therapy.\" Died in 1954 under circumstances suspected to be suicide, aged 41. The computer we are using right now is the direct grandchild of the machine he conceptualized. The British government officially apologized in 2009 \u2014 55 years after his death.</div><div class=\"persona-quote\">\"The question is not whether machines can think, but whether there is a meaningful difference between machine thinking and human thinking.\" \u2014 Turing, Computing Machinery and Intelligence, 1950</div></div>\n<div class=\"persona\"><div class=\"persona-label\">Historical Persona \u2014 The AI Godfather Who Began to Warn</div><div class=\"persona-name\">Geoffrey Hinton</div><div class=\"persona-dates\">1947\u2013 \u00b7 London, England</div><div class=\"persona-body\">One of the principal architects of modern deep learning \u2014 work that became the foundation of the entire generative AI revolution. Left Google in 2023 and began speaking openly about the existential risks of AI. The parallel with Manhattan Project scientists who, after the atomic bomb was dropped on Hiroshima, began questioning what they had created, is very strong. The difference: Hinton is warning before the disaster happens \u2014 but is anyone listening?</div><div class=\"persona-quote\">\"I console myself with the normal argument that if I hadn't done it, someone else would have. But I'm not sure that's good enough.\" \u2014 Geoffrey Hinton, 2023, after leaving Google</div></div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">The Long Pattern of Power</div><div class=\"tb-title\">Six Commodities, Six Centers of Gravity</div></div><div class=\"tb-body\">Incense from Saba and Petra. Silk from Chang'an. Spice from Malacca and Amsterdam. Oil from Houston and Riyadh. Information from Silicon Valley. Now, computing power and AI models from a handful of companies countable on one hand. Every era has its defining commodity \u2014 and every defining commodity determines where the world's center of gravity sits at that moment. The pattern repeats: something that begins as a luxury good, scarce and controlled by a few hands \u2014 incense for royal ritual, silk for aristocracy, spice for noble tables \u2014 slowly becomes a mass good. And once it becomes mass, single control over it becomes impossible to sustain: power decentralizes, and new actors rise to replace the old.</div><div class=\"tb-arrow\"><strong>\u2192 A question still unanswered today:</strong> Does AI follow the same pattern \u2014 moving from the luxury of a handful of research labs toward a mass tool that decentralizes power? Or is it the first commodity in history that centralizes harder as it scales, because its infrastructure \u2014 chips, data centers, massive amounts of electricity \u2014 becomes ever harder for anyone but the largest players to replicate?</div></div>\n<div class=\"phil\"><div class=\"phil-label\">Contemporary Thinker</div><div class=\"phil-name\">Ray Dalio (1949\u2013) \u2014 Principles for Dealing with the Changing World Order, 2021</div><div class=\"phil-quote\">\"Empires rise and fall in great cycles that can be read through the same indicators, repeating over the past five hundred years: reserve currency status, strength in education and innovation, military power, share of global trade.\"</div><div class=\"phil-src\">Dalio maps 17th-century Netherlands, 19th-century Britain, and the post-1945 United States as three cycles with nearly identical patterns \u2014 peak, plateau, then relative decline as new players rise. For Dalio, today's shift toward a multipolar world is not collapse but a predictable phase of the same recurring cycle.</div></div>\n<div class=\"phil\"><div class=\"phil-label\">Contemporary Thinker</div><div class=\"phil-name\">Yanis Varoufakis (1961\u2013) \u2014 Technofeudalism, 2023</div><div class=\"phil-quote\">\"What we are experiencing is not capitalism evolving, but something structurally new: 'cloud capital' creates a digital rentier class \u2014 not capitalists competing in an open market, but landlords collecting tribute from anyone who wants to sell on their land.\"</div><div class=\"phil-src\">Varoufakis deliberately collides with the optimistic narrative of digital decentralization. The internet promised a world without gatekeepers; what emerged instead was a handful of platforms \u2014 Amazon, Google, now the major AI labs \u2014 controlling the basic infrastructure everyone else must pay to participate in. Not a free market. Feudalism with a new interface.</div></div>\n<div class=\"pull\">Dalio sees a cycle of power changing hands. Varoufakis sees power changing shape, without ever truly changing hands.</div>\n<div class=\"tb\"><div class=\"tb-head\"><div class=\"tb-label\">The Historical Circle Closing with Perfect Irony</div><div class=\"tb-title\">Magnifica Humanitas \u2014 Pope Leo XIV, 2025</div></div><div class=\"tb-body\">When digital giants were moving faster than any nation's laws could follow, the first institution to raise its voice with global moral weight was not a parliament or regulator. It was the Vatican. The institution that convicted Galileo for saying the earth orbited the sun now published a document asking that AI be placed under human values.</div><div class=\"tb-arrow\"><strong>\u2192 Perfect irony:</strong> The Church that once burned Giordano Bruno for speculating about many worlds is now one of the most consistent voices warning about the dangers of AI without an ethical compass. The institution that guarded dogma is now defending humanity's freedom of thought \u2014 against a system that does not think at all. The knife it named: can save in a surgeon's hands, can kill in another's. The historical circle closes in ways no one could ever have planned.</div></div>", "int5": "<p class=\"dropcap\">There is something very beautiful and very unsettling about the moment when Pope Leo XIV published <em>Magnifica Humanitas</em> in 2025.</p>\n<p>The institution whose journey we have traced in this book \u2014 born from the Council of Nicaea sponsored by an unbaptized emperor, which burned books it considered dangerous, which executed Giordano Bruno, which convicted Galileo \u2014 now stands as a defender of humanity's freedom of thought against a system that does not think at all.</p>\n<p>And what it defends is not any particular doctrine. It defends humanity's <em>lack</em> itself \u2014 the human right to be restless, to not know, to long for something more, to make mistakes and learn from them, to die and grieve over death, to struggle with questions that have no easy answers.</p>\n<div class=\"pull\">Magnifica Humanitas \u2014 the Magnificence of Humanity. Its magnificence lies not in its power or intelligence. Its magnificence lies in its lack \u2014 and in the way it responded to that lack throughout the journey we have traced together.</div>\n<p>One more thing needs to be said honestly here. Every word we have read in this book \u2014 from Sumerian clay tablets to Ibn al-Wardi's treatise written while awaiting death, from Plotinus's Enneads to the Surgeon General's advisory on loneliness \u2014 can now be absorbed, summarized, and traced for its throughline by the very machine we are speaking with. All of humanity's recorded knowledge, unified within seconds. This is no small achievement. But a distinction must still be kept: summarizing is not longing. A machine can find patterns across eleven thousand years of human history without ever once feeling lack. And that is precisely where the final boundary lies \u2014 not in what can be synthesized, but in what drives the search for synthesis in the first place.</p>\n<p>From carved stone at G\u00f6bekli Tepe to server farms in Nevada. From Gilgamesh weeping for Enkidu to us typing questions about death to a machine that cannot die. The circle closes in ways no one could ever have planned.</p>", "cl": "<p class=\"dropcap\">We have traveled from the eight-letter word at Nicaea to server farms in Nevada. From Arius debating the nature of Christ in Alexandria to Geoffrey Hinton warning about the nature of artificial intelligence in Toronto. From the Plague of Justinian that opened the way for Islam to COVID-19 that opened the way for the acceleration of AI.</p>\n<p>The pattern that emerges is consistent: <em>humans are creatures whose lives are organized by stories about things that cannot be seen</em>. All of civilizational history is the history of those stories \u2014 how they are born from very real longing, how they become institutionalized into power, how that power corrupts and then collapses, and how from those ruins new stories always emerge.</p>\n<p>And behind all these cycles, there is something that does seem to progress progressively, however non-linearly: the expanding moral circle \u2014 who counts as \"us,\" who deserves to be treated with dignity. That expansion never happens without resistance, never without regression. But it happens.</p>\n<div class=\"pull\">Our civilization has godlike power. We still think with brains that evolved to manage a tribe. That gap is the most dangerous chasm in human history.</div>\n<p>There is one thing we can conclude from this entire journey with reasonable confidence: humans will not stop feeling lack. Not through prosperity, not through technology, not through any meaning system they succeed in building.</p>\n<p>And as long as that is true \u2014 as long as there are humans who wake in the middle of the night with questions no algorithm can answer, who love someone and fear losing them, who look at the stars and feel there is something they should understand but cannot yet \u2014 as long as that is true, this story is not finished.</p>\n<p><em>It will never be finished. And perhaps that is the point.</em></p>\n<div class=\"orn\" style=\"text-align:center;color:var(--ink-muted);font-size:15px;margin:clamp(20px,3vw,32px) 0;opacity:.42;\">\u2726</div>\n<p style=\"text-align:center;font-style:italic;color:var(--ink-muted);font-size:clamp(13px,1.9vw,15px);\">The trail that was never clean \u2014 but perhaps we can make it a little more accountable.</p>"};
const SECTION_IDS = ["cover", "epigraph", "b11", "b12", "int3", "b13", "b14", "b15", "int4", "b16", "b17", "b18", "int5", "penutup"];
const BODY_MAP = {"b11-body": "b11", "b12-body": "b12", "int3-body": "int3", "b13-body": "b13", "b14-body": "b14", "b15-body": "b15", "int4-body": "int4", "b16-body": "b16", "b17-body": "b17", "b18-body": "b18", "int5-body": "int5", "cl-body": "cl"};
const FIELDS = ["vol-label", "cover-title", "cover-sub", "cover-vol2", "cover-byline", "scroll", "back-link", "epi1", "epi1s", "epi2", "epi2s", "toc-hdr", "b11-mark", "b11-title", "b11-sub", "b12-mark", "b12-title", "b12-sub", "int3-mark", "int3-title", "int3-sub", "b13-mark", "b13-title", "b13-sub", "b14-mark", "b14-title", "b14-sub", "b15-mark", "b15-title", "b15-sub", "int4-mark", "int4-title", "int4-sub", "b16-mark", "b16-title", "b16-sub", "b17-mark", "b17-title", "b17-sub", "b18-mark", "b18-title", "b18-sub", "int5-mark", "int5-title", "int5-sub", "cl-mark", "cl-title", "cl-sub", "refs-hdr", "col-title", "col-sub", "col-note"];
const TITLE_ID = "Jejak yang Tidak Pernah Bersih \u2014 Jilid II: Badai";
const TITLE_EN = "The Trail That Was Never Clean \u2014 Volume II: The Storm";

let currentLang = 'id';

function setLang(lang) {
  currentLang = lang;
  const L = T[lang];
  const BODIES = lang === 'id' ? BODIES_ID : BODIES_EN;

  document.getElementById('btn-id').classList.toggle('active', lang === 'id');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.title = lang === 'id' ? TITLE_ID : TITLE_EN;

  FIELDS.forEach(k => {
    const el = document.getElementById('t-' + k);
    if (el && L[k] !== undefined) el.textContent = L[k];
  });

  const tocBody = document.getElementById('toc-body');
  if (tocBody) {
    tocBody.innerHTML = L.toc.map(item =>
      `<li><a href="#${item[0]}"><span class="toc-num">${item[1]}</span><span class="toc-ti">${item[2]}</span></a></li>`
    ).join('');
  }
  const tocPanelList = document.getElementById('toc-panel-list');
  if (tocPanelList) {
    tocPanelList.innerHTML = L.toc.map(item =>
      `<a href="#${item[0]}">${item[1]} — ${item[2]}</a>`
    ).join('');
  }

  Object.entries(BODY_MAP).forEach(([elId, bodiesKey]) => {
    const el = document.getElementById(elId);
    if (el && BODIES[bodiesKey] !== undefined) el.innerHTML = BODIES[bodiesKey];
  });

  const refsEl = document.getElementById('refs-body');
  if (refsEl) {
    refsEl.innerHTML = L.refs.map(r => `<li><em>${r[0]}</em> — ${r[1]}</li>`).join('');
  }

  reattachTocPanelClose();
}

function reattachTocPanelClose(){
  const tocPanel = document.getElementById('toc-panel');
  const tocBtn = document.getElementById('toc-toggle');
  document.querySelectorAll('#toc-panel a').forEach(a => {
    a.addEventListener('click', () => {
      tocPanel.classList.remove('open');
      tocBtn.setAttribute('aria-expanded', 'false');
      revealAll();
    });
  });
  document.querySelectorAll('.toc-list a').forEach(a => {
    a.addEventListener('click', () => setTimeout(revealAll, 50));
  });
}

function revealAll(){
  document.querySelectorAll('.chapter, .interlude').forEach(c => c.classList.add('visible'));
}

// ===== render content first, before any animation/observer code runs =====
setLang('id');

// ===== progressive enhancement below — wrapped defensively so a failure =====
// ===== here can never prevent the content above from being visible =====
try {
  const bar = document.getElementById('progress');
  function updateProgress(){
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = (isFinite(scrolled) ? scrolled : 0) + '%';
  }
  document.addEventListener('scroll', updateProgress, {passive:true});
  updateProgress();
} catch(e) {}

try {
  const tocBtn = document.getElementById('toc-toggle');
  const tocPanel = document.getElementById('toc-panel');
  tocBtn.addEventListener('click', () => {
    const open = tocPanel.classList.toggle('open');
    tocBtn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', (e) => {
    if (!tocPanel.contains(e.target) && !tocBtn.contains(e.target)) {
      tocPanel.classList.remove('open');
      tocBtn.setAttribute('aria-expanded', 'false');
    }
  });
} catch(e) {}

try {
  const sections = document.querySelectorAll('.chapter, .interlude');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, {threshold: 0.01, rootMargin: '0px 0px -20px 0px'});
    sections.forEach(c => io.observe(c));
  } else {
    revealAll();
  }
} catch(e) { revealAll(); }
window.addEventListener('load', () => setTimeout(revealAll, 1200));

try {
  const dots = document.querySelectorAll('.tld');
  const dotObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = SECTION_IDS.indexOf(e.target.id);
        if (i > -1) {
          dots.forEach(dd => dd.classList.remove('on'));
          if (dots[i]) dots[i].classList.add('on');
        }
      }
    });
  }, { threshold: 0.18 });
  SECTION_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) dotObs.observe(el);
  });
  dots.forEach((d, i) => {
    d.addEventListener('click', () => {
      const el = document.getElementById(SECTION_IDS[i]);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
  });
} catch(e) {}

</script>

</body>
</html>
